# DRAFT of the F-Droid build recipe of the Android app (milestone M21), to be
# submitted by the owner as metadata/link.reminis.app.yml in a merge request
# to https://gitlab.com/fdroid/fdroiddata (see docs/android/publication.md,
# "F-Droid"). Not used by this repository's own build. Check every value
# against the first tag before submitting: versionName, versionCode and
# commit must be those of android/version.properties at the tag.

Categories:
  - Connectivity
  - Games
License: MIT
AuthorName: Thomas Fournier
WebSite: https://reminis.link
SourceCode: https://github.com/tfournier/ReminisLink
IssueTracker: https://github.com/tfournier/ReminisLink/issues
Changelog: https://github.com/tfournier/ReminisLink/releases

AutoName: ReminisLink

RepoType: git
Repo: https://github.com/tfournier/ReminisLink.git

Builds:
  - versionName: 1.0.0
    versionCode: 1000099
    commit: android-v1.0.0
    # The store listing is android/app/fastlane: fdroidserver only reads a
    # nested fastlane folder whose parent is this subdir.
    subdir: android/app
    gradle:
      - yes
    # The repository also holds the pak (Go), the iOS app and test data: not
    # part of the Android build. testdata/ has made-up disc images (.bin) for
    # the pak's tests.
    scanignore:
      - testdata
      - ios
    scandelete:
      - android/gradle/wrapper/gradle-wrapper.jar

# Reproducible build (optional, recommended): F-Droid builds the APK itself
# and, when it matches the APK of the GitHub release byte for byte (apart
# from the signature), publishes the developer-signed APK. Uncomment once the
# F-Droid build is known to match; AllowedAPKSigningKeys is the SHA-256 of the signing
# certificate (apksigner verify --print-certs, "SHA-256 digest", lower case,
# no colons).
# Binaries: https://github.com/tfournier/ReminisLink/releases/download/android-v%v/ReminisLink-android-%v.apk
# AllowedAPKSigningKeys: e9ebbb6f9cd986f1ba2124d8d3c4804ec63723f0ae60d4672f5e88c4b8baa9e5

AutoUpdateMode: Version
UpdateCheckMode: Tags ^android-v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: android/version.properties|versionCode=(\d+)|.|versionName=(.+)
CurrentVersion: 1.0.0
CurrentVersionCode: 1000099
