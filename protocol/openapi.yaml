        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/save/backups:
    get:
      tags: [Saves]
      operationId: listSaveBackups
      summary: List the save backups
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: |
            Backups, newest first (by creation order on the device, not by
            date). At most 10 automatic backups (`before-*`) are kept per game;
            older ones are moved to the trash (`delete-backup`). Manual backups
            are not limited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupList' }
              example:
                backups:
                  - { id: bk_20261118T170000Z_a1b2, label: Avant le boss final, createdAt: '2026-11-18T17:00:00Z', sizeBytes: 131072, reason: manual }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    post:
      tags: [Saves]
      operationId: createSaveBackup
      summary: Back up the current save ("duplicate the save")
      description: |
        Copies the current save as a manual backup. The clock file of the
        game (`.rtc`), when there is one, is copied with it (every backup,
        manual or automatic, holds both); `sizeBytes` is the size of the
        save alone.
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBackupRequest' }
            example: { label: Avant le boss final }
      responses:
        '201':
          description: Backup created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backup' }
              example: { id: bk_20261118T170000Z_a1b2, label: Avant le boss final, createdAt: '2026-11-18T17:00:00Z', sizeBytes: 131072, reason: manual }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /games/{gameId}/save/backups/{backupId}:
    get:
      tags: [Saves]
      operationId: downloadSaveBackup
      summary: Download a save backup
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/BackupId'
      responses:
        '200':
          description: The save file of the backup (its clock file, if any, is not part of the download).
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
          content:
            application/octet-stream:
              schema: { $ref: '#/components/schemas/Binary' }
              example: '<binary file content>'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    delete:
      tags: [Saves]
      operationId: deleteSaveBackup
      summary: Delete a save backup
      description: The backup is moved to the trash (`delete-backup`), never erased directly.
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/BackupId'
      responses:
        '204': { description: Backup deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/save/backups/{backupId}/restore:
    post:
      tags: [Saves]
      operationId: restoreSaveBackup
      summary: Restore a save backup
      description: |
        Copies the current save first (`before-restore`), then replaces the
        save with the chosen backup. The response carries that safety copy
        (null if there was no current save). The clock file of the game
        (`.rtc`) is backed up with the save and restored with it when the
        backup has one (renamed before the save); a backup without clock
        file (made when the game had none) restores the save only and
        leaves the current clock file in place (it is in the safety copy).
        `409 conflict` when the backup does not match its checksum (nothing
        is changed).
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/BackupId'
      responses:
        '200':
          description: Save restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupResult' }
              example:
                backup: { id: bk_20261118T171000Z_e5f6, label: null, createdAt: '2026-11-18T17:10:00Z', sizeBytes: 131072, reason: before-restore }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /states:
    get:
      tags: [States]
      operationId: listAllStates
      summary: List every state of every game (sync, M19)
      description: |
        M19. Read only. Every state of every game of every system, in one
        request, with its size, date and SHA-256 (and those of its
        thumbnail), so the app downloads (`GET /games/{gameId}/states/{slot}`,
        `GET /games/{gameId}/states/{slot}/thumbnail`) only the states
        whose `sha256` changed since its last sync, as `GET /saves` does
        for the saves.

        Same games as `GET /saves` (`file`, `m3u`, `folder-m3u` and
        `folder-cue`, subfolders included) and same state resolution as
        `GET /games/{gameId}/states` (state folder of the system's
        emulator core, file named after the ROM, the `.m3u` or the `.cue`,
        ignoring case); one file per slot, `<name>.st<slot>` with the slot
        in decimal without leading zero as NextUI writes it (`.st01` is not
        slot 1), the very file `GET /games/{gameId}/states/{slot}` serves
        and the archives export; two games of a system with the same ROM
        file name share their states on NextUI and are both listed. Order: by
        system, game, then slot. Locked copies and the resume history are
        not listed.

        Hashes: a state's hash is kept in memory while the file (device
        and inode), its size, its modification time and, where the
        platform has one, its status change time are unchanged, and only
        when it was modified at least 3 s before the hash was computed:
        NextUI does not run while the pak runs, and the pak replaces a
        state by renaming a new file over it, so the first request after
        the pak starts hashes every state and the next ones only the
        changed ones. Files that are symbolic links, reached through one,
        or outside the states folder (the thumbnails folder for a
        thumbnail) are skipped; a thumbnail that is not a PNG is `null`.
        One listing runs at a time (a second request waits); it stops if
        the client goes away. At most 20000 states: beyond, `truncated` is
        true and the app must not infer anything from a state missing
        from the list. `path` is informative and never sent back;
        `modifiedAt` comes from the device clock (informative): compare
        `sha256`.
      responses:
        '200':
          description: The states.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StateList' }
              example:
                states:
                  - gameId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Ta3kgR2FyZGVuIFF1ZXN0LmdiYQ
                    systemId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKQ
                    gameName: Sky Garden Quest
                    fileName: Sky Garden Quest.gba
                    slot: 0
                    path: .userdata/shared/GBA-gpsp/Sky Garden Quest.gba.st0
                    sizeBytes: 401408
                    modifiedAt: '2026-11-18T16:55:00Z'
                    sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    thumbnail: { sizeBytes: 50211, sha256: 60303ae22b998861bce3b28f33eec1be758a213c86c93c076dbe9f558c11c752 }
                truncated: false
                generatedAt: '2026-11-21T10:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/states:
    get:
      tags: [States]
      operationId: listStates
      summary: State slots of a game
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: |
            Occupied slots (and slots with only a locked copy), by slot number.
            `lockStatus: restored` is reported by one call only: the next call
            reports `intact`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlotList' }
              example:
                slots:
                  - { slot: 0, sizeBytes: 401408, modifiedAt: '2026-11-18T16:55:00Z', hasThumbnail: true, locked: true, lockStatus: intact }
                  - { slot: 1, sizeBytes: 401408, modifiedAt: '2026-11-17T20:12:00Z', hasThumbnail: false, locked: false, lockStatus: null }
                resumeSlot: 9
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/states/{slot}:
    get:
      tags: [States]
      operationId: downloadState
      summary: Download a state
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Slot'
      responses:
        '200':
          description: The state file.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
          content:
            application/octet-stream:
              schema: { $ref: '#/components/schemas/Binary' }
              example: '<binary file content>'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    delete:
      tags: [States]
      operationId: deleteState
      summary: Delete a state (to the trash)
      description: |
        The state is moved to the trash, with its NextUI thumbnail and disc
        file (`.minui/<TAG>/<rom>.<N>.bmp` and `.txt`). A locked slot gives
        `409 state_locked`.
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Slot'
      responses:
        '200':
          description: Moved to the trash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashMoveResult' }
              example:
                trashEntryId: tr_20261118T171500Z_0c1d
                moved: [.userdata/shared/.minui/GBA/Sky Garden Quest.gba.st1]
                movedBytes: 401408
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/states/{slot}/thumbnail:
    get:
      tags: [States]
      operationId: getStateThumbnail
      summary: State thumbnail (PNG)
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Slot'
      responses:
        '200':
          description: |
            The thumbnail NextUI saved with the state (slots 0 to 7 only; a
            screen capture, 1024×768 on the Brick, not reduced). NextUI writes
            it as PNG in a `.bmp` file; the pak serves it only when it starts
            with the PNG signature, otherwise `404`.
          content:
            image/png:
              schema: { type: string, contentMediaType: image/png }
              example: '<PNG image bytes>'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/states/{slot}/lock:
    put:
      tags: [States]
      operationId: lockState
      summary: Lock a state
      description: |
        Copies the state to the lock area and records its SHA-256 and its
        state folder (`<TAG>-<core>`); the NextUI thumbnail and disc file of
        the slot (`.minui/<TAG>/<rom>.<N>.bmp` and `.txt`) are copied with
        it and put back with it. Locking a locked slot changes nothing,
        except for a lock whose state folder is unknown (`modified`): locking
        it again confirms it (the old copy goes to the trash and the current
        state is locked).
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Slot'
      responses:
        '200':
          description: The updated slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
              example: { slot: 0, sizeBytes: 401408, modifiedAt: '2026-11-18T16:55:00Z', hasThumbnail: true, locked: true, lockStatus: intact }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
    delete:
      tags: [States]
      operationId: unlockState
      summary: Unlock a state
      description: |
        Removes the lock. The state itself does not change. The locked copy is
        erased when the state holds the same bytes; otherwise (state missing
        or different) it is moved to the trash. Unlocking a slot that is not
        locked answers the slot as it is (`404` only when the slot is empty).
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Slot'
      responses:
        '200':
          description: The updated slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
              example: { slot: 0, sizeBytes: 401408, modifiedAt: '2026-11-18T16:55:00Z', hasThumbnail: true, locked: false, lockStatus: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/states/{slot}/restore:
    post:
      tags: [States]
      operationId: restoreLockedState
      summary: Restore the locked copy of a state
      description: |
        Replaces the state with its locked copy; the current state (with its
        NextUI thumbnail and disc file) is moved to the trash first (reason
        `restore`); the thumbnail and disc file kept with the lock are put
        back (a lock without a disc file leaves the current one in place).
        `404` when the slot is not locked; `409 conflict` when the copy is
        damaged, comes from another emulator core, or its state folder is
        unknown (lock it again to confirm).
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Slot'
      responses:
        '200':
          description: The updated slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
              example: { slot: 0, sizeBytes: 401408, modifiedAt: '2026-11-18T17:20:00Z', hasThumbnail: true, locked: true, lockStatus: intact }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /games/{gameId}/resume-history:
    get:
      tags: [States]
      operationId: listResumeHistory
      summary: History of the resume state
      description: |
        The last 5 distinct versions of the resume state, archived by the pak
        at each start when the state differs from every entry (date and size
        first, SHA-256 when they changed). Older entries are moved to the
        trash (`delete-backup`).
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: History entries, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeHistory' }
              example:
                entries:
                  - { id: rh_20261118T165500Z, capturedAt: '2026-11-18T16:55:00Z', sizeBytes: 401408 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/resume-history/{entryId}/restore:
    post:
      tags: [States]
      operationId: restoreResumeHistoryEntry
      summary: Restore a version of the resume state
      description: |
        Replaces the resume state with this version; the current version is
        archived first. Returns the updated history. `409 state_locked` when
        the resume slot is locked; `409 conflict` when the entry is damaged or
        was archived from another emulator core (versions of different cores
        are never compared nor restored into each other); `422
        unsupported_format` when the console has no resume slot.
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: entryId
          in: path
          required: true
          description: Resume history entry identifier.
          schema: { $ref: '#/components/schemas/OpaqueId' }
          example: rh_20261118T165500Z
      responses:
        '200':
          description: The updated history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeHistory' }
              example:
                entries:
                  - { id: rh_20261118T172500Z, capturedAt: '2026-11-18T17:25:00Z', sizeBytes: 401408 }
                  - { id: rh_20261118T165500Z, capturedAt: '2026-11-18T16:55:00Z', sizeBytes: 401408 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /games/{gameId}/cheats:
    get:
      tags: [Cheats]
      operationId: getCheats
      summary: Read the cheat list
      description: RetroArch `.cht` format, managed like Cheat Manager (unknown keys kept in `extra`).
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Cheats and the ETag of the file.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheatList' }
              example:
                cheats:
                  - { index: 0, description: Infinite money, code: 82025490+FFFF, enabled: false, extra: { handler: '0' } }
                etag: '"sha256-9b1f"'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    put:
      tags: [Cheats]
      operationId: replaceCheats
      summary: Replace the cheat list
      description: |
        The complete list, in order (`index` is ignored: cheats are renumbered).
        The previous file is kept as `.cht.bak`; the previous `.bak`, if any,
        is first moved to the trash (reason `overwrite`), so no version is
        lost. The new file is written atomically. Imports do the same.
        If the file changed since `If-Match`: `412` with code `conflict`
        (`*` matches an existing file); a missing `If-Match` is
        `400 invalid_request`. The ETag of a game without cheat file is the
        one of an empty file. An empty list deletes the `.cht` file (its
        content stays in the `.bak`). M8: a current file that cannot be
        read to its end (a line too long) is never rewritten
        (`422 unsupported_format`), and a list whose file would exceed the
        8 MiB the reads accept is refused before anything changes (`413`);
        imports check both too.
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: If-Match
          in: header
          required: true
          description: '`etag` returned by `GET /games/{gameId}/cheats`.'
          schema: { type: string }
          example: '"sha256-9b1f"'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheatsUpdate' }
            example:
              cheats:
                - { index: 0, description: Infinite money, code: 82025490+FFFF, enabled: true, extra: { handler: '0' } }
      responses:
        '200':
          description: The new list and ETag.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheatList' }
              example:
                cheats:
                  - { index: 0, description: Infinite money, code: 82025490+FFFF, enabled: true, extra: { handler: '0' } }
                etag: '"sha256-77ac"'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/cheats/import:
    post:
      tags: [Cheats]
      operationId: importCheats
      summary: Import cheats
      description: |
        Sources: `sd` (`sdFileId` from `GET /sd/files`), `inline` (`.cht` text, 1 MiB
        max), `upload` (`uploadId` of an upload with `target.kind = "staging"`
        completed since the pak started), `staging` (`stagingId` returned by
        that upload, valid until the staging file is purged after 24 h;
        prefer it to `upload`). `sd`, `upload` and `staging` files are read up
        to 5 MiB (`413` beyond). `mode`: `merge` appends the cheats after the
        current ones, `replace` replaces them (the comment lines of the
        current file are kept). `422 unsupported_format` if no cheat is
        found. The pak never fetches a URL (the `url` source was removed
        from v1).
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheatImportRequest' }
            example:
              source: { type: staging, stagingId: st_01JD3Y4K5M6N }
              mode: merge
      responses:
        '200':
          description: Imported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheatImportResult' }
              example: { imported: 15, total: 27 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /sd/files:
    get:
      tags: [Cheats]
      operationId: listSdFiles
      summary: List the cheat and patch files on the SD card
      description: |
        `type=cht`: `.cht` files under `Cheats/`. `type=patch`: `.ips`, `.bps`,
        `.ups` files under `Roms/` and under `ReminisLink/patches/`. Hidden
        files and folders are skipped; at most 5000 files, 8 folder levels.
        Sorted by path. A missing or unknown `type` is `400 invalid_request`.
      parameters:
        - name: type
          in: query
          required: true
          description: Kind of files to list.
          schema: { type: string, enum: [cht, patch] }
          example: cht
      responses:
        '200':
          description: Usable files.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SdFileList' }
              example:
                files:
                  - { id: sd_Q2hlYXRzL0dCQS9Ta3kgR2FyZGVuIFF1ZXN0LmdiYS5jaHQ, path: Cheats/GBA/Sky Garden Quest.gba.cht, sizeBytes: 2048 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /uploads:
    post:
      tags: [Transfers]
      operationId: createUpload
      summary: Create a resumable upload
      description: |
        The device checks free space (size + 5 %), reserves a temporary file
        on the SD card and returns `uploadId` and `chunkSize` (default 4 MiB,
        at most 16 MiB). The announced `sha256` protects the unsigned chunks.
        `onConflict`: `fail` (`409 conflict`), `rename` (adds ` (2)`,
        ` (3)`...), `overwrite` (the old file goes to the trash). It only
        applies to the `rom`, `staging` and `pak` targets (a staging file never
        conflicts); for `save` the existing save is always replaced, after
        being copied as a `before-replace` backup; for `state` the existing
        state is always replaced, after being moved to the trash. For the
        `pak` target (M12) only `fail` and `overwrite` are accepted
        (`rename` is `400 invalid_request`); the pak name is only known once
        the archive is read, so the conflict is checked by the installation
        job, never at creation; a `pak` upload is at most 1 GiB
        (`413 too_large`). At most 32 uploads are
        open at once (`429 too_many_attempts` with `Retry-After` beyond).
        Uploads idle for 24 h are deleted. Uploads survive a restart of the
        pak: the offset is the size of the partial file on the card, and the
        SHA-256 of the bytes received is computed again in the background
        from the bytes really present. `GET /uploads/{uploadId}` answers at
        once; `PUT` and `complete` answer `429 too_many_attempts` with
        `Retry-After` while that verification runs. An upload purged
        (idle 24 h) or whose partial file became unreadable answers `404`:
        the app creates it again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUploadRequest' }
            example:
              target: { kind: rom, systemId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKQ, folderId: null, fileName: Sky Garden Quest DX.gba }
              sizeBytes: 33554432
              sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
              onConflict: fail
      responses:
        '201':
          description: Upload created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadCreated' }
              example: { uploadId: up_01JD3X5V7Q9W, chunkSize: 4194304, offset: 0, expiresAt: '2026-11-19T17:00:00Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /uploads/{uploadId}:
    get:
      tags: [Transfers]
      operationId: getUpload
      summary: Upload state (to resume)
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: Bytes received so far.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadStatus' }
              example: { uploadId: up_01JD3X5V7Q9W, offset: 12582912, sizeBytes: 33554432 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    put:
      tags: [Transfers]
      operationId: uploadChunk
      summary: Send a chunk
      description: |
        The only route where `X-RL-Content-SHA256` is `UNSIGNED` (the body
        is not hashed in the signature; the whole file is checked against
        the `sha256` announced at creation). `Upload-Offset` must equal the
        current offset, otherwise `409 conflict` with `details.offset`.
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - name: Upload-Offset
          in: header
          required: true
          description: Offset of this chunk in the file.
          schema: { type: integer, format: int64, minimum: 0 }
          example: 12582912
        - name: Content-Length
          in: header
          required: true
          description: Chunk size (at most `chunkSize`).
          schema: { type: integer, format: int64, minimum: 1, maximum: 16777216 }
          example: 4194304
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { $ref: '#/components/schemas/Binary' }
            example: '<binary file content>'
      responses:
        '204':
          description: Chunk stored.
          headers:
            Upload-Offset:
              description: New offset.
              schema: { type: integer, format: int64, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
    delete:
      tags: [Transfers]
      operationId: cancelUpload
      summary: Cancel an upload
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204': { description: Upload cancelled and its temporary file deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /uploads/{uploadId}/complete:
    post:
      tags: [Transfers]
      operationId: completeUpload
      summary: Finish an upload
      description: |
        The device compares the SHA-256 (computed while receiving); on a
        mismatch, `409 checksum_mismatch` and the upload is deleted.
        Otherwise `fsync`, conflict rule, rename to the destination. The
        response depends on the target: `rom` → `gameId`, `save` → `backup`
        (copy of the previous save), `state` → `slot`, `staging` →
        `stagingId`, `pak` → `jobId` (M12).

        `pak` target (M12): the archive is moved to the staging area of the
        pak (the upload is finished) and a job of kind `pak-install` is
        queued, as with `POST /paks/install`: extracting an archive of up to
        1 GiB can take longer than a request should. Its result is
        `{ "pakId": "..." }`; it fails with `422 unsupported_format` (not a
        zip, or an archive refused by the rules of `POST /paks/install`),
        `409 conflict` (`onConflict: fail` and the pak exists, or the pak is
        ReminisLink itself) or `507 insufficient_storage`. The app follows
        it with `GET /jobs/{jobId}` or the `job` events.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: The created resource.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResult' }
              example: { gameId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9IYWNrcy9Ta3kgR2FyZGVuIFF1ZXN0IERYLmdiYQ }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /games/{gameId}/patch:
    post:
      tags: [Transfers]
      operationId: patchGame
      summary: Apply a patch (creates a job)
      description: |
        Formats: IPS (with the EOF truncation extension), BPS (source, target
        and patch CRC32 checked), UPS (CRC32 checked). `output.mode`:
        `new-file` (default, a new ROM next to the original) or `replace`
        (the original goes to the trash). The job result holds the `gameId`
        of the produced ROM; a failed job carries `422 unsupported_format` or
        `422 patch_mismatch` in its `error`.

        Details (M6): the format comes from the header (`PATCH`, `BPS1`,
        `UPS1`), never the extension; a file that is none of them is
        refused at once (`422 unsupported_format`), a corrupt patch
        (truncated, wrong patch CRC32) fails its job with
        `unsupported_format`. `patch_mismatch` has `details.reason`:
        `source-mismatch` (another ROM version) or `already-patched` (the
        ROM is the target of the patch: refused, never patched backwards).
        Only single-file games can be patched: `m3u`, `folder-m3u` and
        `folder-cue` games and `.zip`/`.7z` ROMs answer `422 unsupported_format`.
        `new-file`: default name `<name> (patched).<ext>`; the default or
        given `fileName` (cleaned, and it must be a ROM name, else
        `400 invalid_name`) always ends with the extension of the ROM: it
        is added when the name does not already end with it, ignoring case
        (`Hack v1.2` → `Hack v1.2.gba`, `Hack.zip` → `Hack.zip.gba`,
        `Hack.GBA` kept); the name then gets ` (2)`, ` (3)`... when taken.
        `replace`:
        the save is first backed up (`before-patch`), the ROM goes to the
        trash (`replace-rom`); save, states, locks and cheats keep their
        names and stay with the game; `fileName` is ignored. A job whose
        ROM changed while it ran fails with `409 conflict`.

        Job result: `{ "gameId": "...", "verified": true }`; `verified` is
        `false` for IPS, which carries no checksum (the ROM and the result
        cannot be checked). `source-mismatch` details also hold
        `expectedSize`, `actualSize`, `expectedCrc32` and, when the sizes
        match, `actualCrc32` (8 lowercase hex digits). The progress `total`
        counts the bytes read for the checksums before writing (patch and
        ROM, BPS and UPS) plus the patched file, so it moves from the start.
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchRequest' }
            example:
              patch: { type: staging, stagingId: st_01JD3Y4K5M6N }
              output: { mode: new-file, fileName: Sky Garden Quest (FR).gba }
      responses:
        '202':
          description: Job created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
              example: { jobId: job_01JD3Y7P8Q9R }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /archives/{stagingId}:
    get:
      tags: [Archives]
      operationId: inspectGameArchive
      summary: Check a game archive and preview its import (M19)
      description: |
        Read only. Checks the game archive of a staging entry (an upload
        with `target.kind = "staging"`, whose `stagingId` the completion
        returned) and says what `POST /archives/{stagingId}/import` would
        do with the same target, computed by the same code: for each file
        of the manifest, `create`, `replace` (the current file goes to the
        trash first) or `skip` with a `reason`. Informative: the card can
        change before the import, which computes everything again under
        the write lock. Never waits for a write.

        Target (query): `gameId` (the data go to this game; a ROM in the
        archive is skipped, `game-exists`), or `systemId` with an optional
        `folderId` (a new game is made from the archive's ROM, then
        receives the data; the archive must hold a ROM, else
        `422 unsupported_format`; its file name, `source.fileName` cleaned
        like an upload, must be a game name, else `400 invalid_name`, and
        free in the folder and not the ROM file name of another game of the
        system (whose save, clock file and states it would share), else
        `409 conflict` with `details.existing` and, when it is a game,
        `details.gameId`, which the app offers as the target). Without either, the pak suggests one: a
        game of a system with the archive's tag whose data are named after
        the same ROM file name (ignoring case), else, when the archive
        holds a ROM, the top folder of the first system with that tag;
        `target` is `null` when nothing fits (every entry is then `skip`,
        `no-target`) and the app asks the user to choose a game. `gameId`
        and `systemId` together: `400 invalid_request`.

        **Checks** (rule 2 of CLAUDE.md), the same for the import: the
        central directory is bounded before it is read (at most 4 MiB),
        at most 512 entries, then every entry: no absolute path, no `..`,
        `.` or empty component, no backslash, NUL or control character,
        valid UTF-8, components of at most 255 bytes and paths of at most
        1024 bytes; no symbolic link nor anything that is neither a file
        nor a folder; no encryption; stored or deflated only; no two
        entries whose paths differ only by case; no entry of more than
        1 MiB compressed more than 200 times. `manifest.json` (at most
        1 MiB) must be readable, of `format` `reminislink-game-archive`
        and `version` 1 (a higher version is refused: the archive comes
        from a newer ReminisLink), and list every file entry of the
        archive exactly once (an entry missing from the manifest, or a
        manifest file missing from the archive, refuses it; `__MACOSX/`
        and folders are ignored), each with a known `role`, a `slot` from
        0 to 99 for `state` and `state-thumbnail` (none otherwise), the
        announced `sizeBytes` of its entry and a `sha256`; at most one
        `save`, `rtc`, `cheats`, `art` and `rom`, one `state` and one
        `state-thumbnail` per slot. Sizes: a ROM at most 4 GiB, any other
        file at most 256 MiB (art at most 4 MiB, cheats at most 1 MiB),
        5 GiB in all; a `state-thumbnail` or `art` must start with the PNG
        signature. The import also checks every byte it extracts against
        the manifest's size and SHA-256. Refusals: `422 unsupported_format`
        with an English `message`.

        Skip reasons: `game-exists` (a ROM with a game target), `locked`
        (the target slot is locked, M5), `unsupported-format` (the console
        uses a save or state format the pak does not write, or a thumbnail
        for a slot this OS keeps none for), `no-state-folder` (no emulator
        pak for the system), `no-state` (a thumbnail without its state, or
        whose state is skipped), `no-target`.
      parameters:
        - $ref: '#/components/parameters/StagingId'
        - name: gameId
          in: query
          required: false
          description: Target game (its data are replaced).
          schema: { $ref: '#/components/schemas/OpaqueId' }
        - name: systemId
          in: query
          required: false
          description: Target system of a new game made from the archive's ROM.
          schema: { $ref: '#/components/schemas/OpaqueId' }
        - name: folderId
          in: query
          required: false
          description: Folder of the system for the new game (with `systemId`); its top folder when absent.
          schema: { $ref: '#/components/schemas/OpaqueId' }
      responses:
        '200':
          description: The archive is valid; what its import would do.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchivePlan' }
              example:
                manifest:
                  format: reminislink-game-archive
                  version: 1
                  createdAt: '2026-11-21T10:00:00Z'
                  source:
                    deviceName: Brick de Thomas
                    os: nextui
                    platform: tg5040
                    pakVersion: 1.1.0
                    systemTag: GBA
                    systemLabel: Game Boy Advance
                    gameName: Sky Garden Quest
                    fileName: Sky Garden Quest.gba
                    romName: Sky Garden Quest.gba
                    kind: file
                  files:
                    - { path: save/Sky Garden Quest.gba.sav, role: save, sizeBytes: 131072, sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08 }
                    - { path: states/0/Sky Garden Quest.gba.st0, role: state, slot: 0, sizeBytes: 401408, sha256: 60303ae22b998861bce3b28f33eec1be758a213c86c93c076dbe9f558c11c752 }
                target: { gameId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Ta3kgR2FyZGVuIFF1ZXN0LmdiYQ }
                targetName: Sky Garden Quest
                suggested: true
                entries:
                  - { role: save, slot: null, sizeBytes: 131072, action: replace, reason: null }
                  - { role: state, slot: 0, sizeBytes: 401408, action: create, reason: null }
                importBytes: 532480
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    delete:
      tags: [Archives]
      operationId: deleteStagedArchive
      summary: Delete an uploaded archive from the staging area (M19)
      description: |
        The app abandons an import (the preview is closed, or the archive
        was refused): the staging entry is deleted at once rather than at
        the 24 h purge, so that large archives do not fill the card. It
        touches the pak's staging area only (no write lock is taken). An
        import job still running on this entry: `409 conflict`. A staging
        entry is also deleted by the success of its import.
      parameters:
        - $ref: '#/components/parameters/StagingId'
      responses:
        '204': { description: Staging entry deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /archives/{stagingId}/import:
    post:
      tags: [Archives]
      operationId: importGameArchive
      summary: Import a game archive (creates a job, M19)
      description: |
        Imports the game archive of a staging entry into the target game
        (or into a new game made from its ROM), with the checks of
        `GET /archives/{stagingId}`; a job of kind `archive-import` is
        queued (`202`) once the request and the archive were checked
        (`400`, `404` for an unknown staging entry or target,
        `422 unsupported_format` for a refused archive or a system target
        without a ROM in the archive).

        The job extracts the files to import into the pak's own area
        (never next to the game), checking each one against the size and
        SHA-256 of the manifest (`422 unsupported_format` otherwise), after
        checking the free space (`507`). Then, holding the write lock (see
        "Writes one at a time"; the job checks again that its client was
        not revoked), it computes again the destination of every file for
        the target game, by role, with the names this console uses (save
        and clock file named after the ROM, states in the state folder of
        the system's emulator core, thumbnails, cheats, art), matching an
        existing file ignoring case (exFAT); when the save or its clock file
        is replaced, it backs up the current save (`before-import`, with
        its clock file), then moves every file that
        is replaced (and the thumbnail of a replaced state) to one trash
        entry (reason `import-archive`, label: the game name) and renames
        the new files into place, as one journaled replacement (M8, also
        when nothing is replaced): a
        failure puts everything back and fails the job; a power cut is
        finished or rolled back when the pak starts again. Nothing else is
        removed. Files that cannot be imported are skipped with the
        reasons of `GET /archives/{stagingId}` (a locked state is never
        replaced). A new game (system target) must not exist yet: a ROM
        name (`source.fileName`, cleaned like an upload, and listed as a
        game, else `400 invalid_name`) already taken in the folder fails
        the job with `409 conflict` (`details.existing`); the app then
        offers that game as the target. The staging entry is deleted when
        the job succeeds.

        Job result: `{ "gameId": "...", "imported": 4, "skipped":
        [ { "role": "state", "slot": 0, "reason": "locked" } ],
        "trashEntryId": "tr_…" | null, "saveBackupId": "bk_…" | null }`.
        A `library` event follows (M14).
      parameters:
        - $ref: '#/components/parameters/StagingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveImportRequest' }
            example: { target: { gameId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Ta3kgR2FyZGVuIFF1ZXN0LmdiYQ } }
      responses:
        '202':
          description: Job created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
              example: { jobId: job_0123456789abcdef01234567 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: Recent jobs
      description: Queued, running and recently finished jobs (finished jobs are kept 1 hour in memory).
      responses:
        '200':
          description: Jobs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobList' }
              example:
                jobs:
                  - id: job_01JD3Y0A2B3C
                    kind: patch
                    state: running
                    progress: { done: 12582912, total: 536870912 }
                    createdAt: '2026-11-18T17:00:00Z'
                    updatedAt: '2026-11-18T17:00:12Z'
                    result: null
                    error: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Job state
      description: The app polls it every second while the screen is visible.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              example:
                id: job_01JD3Y7P8Q9R
                kind: patch
                state: succeeded
                progress: { done: 16777216, total: 16777216 }
                createdAt: '2026-11-18T17:00:00Z'
                updatedAt: '2026-11-18T17:00:04Z'
                result: { gameId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Ta3kgR2FyZGVuIFF1ZXN0IChGUikuZ2Jh }
                error: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    delete:
      tags: [Jobs]
      operationId: cancelJob
      summary: Cancel a job
      description: |
        Cancels a queued or running job (its partial file is deleted).
        Returns the job in its real state when the answer is sent: a queued
        job is `cancelled` at once; a running job gets
        `cancelRequested: true` and the pak waits (about 10 s at most) for
        it to stop. It stays `running` until its real end and is only
        `cancelled` if it stopped without installing anything; a job
        cancelled while it is already installing its file ends `succeeded`
        (the file is in place and `result` says where). The state never
        goes from `cancelled` to anything else.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The cancelled job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              example:
                id: job_01JD3Y0A2B3C
                kind: patch
                state: cancelled
                progress: { done: 12582912, total: null }
                createdAt: '2026-11-18T17:00:00Z'
                updatedAt: '2026-11-18T17:00:20Z'
                result: null
                error: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /paks:
    get:
      tags: [Paks]
      operationId: listPaks
      summary: Installed tool and emulator paks (M12)
      description: |
        The folders whose name ends with `.pak` (ignoring case) in
        `Tools/<platform>/` (`kind: tool`) and `Emus/<platform>/`
        (`kind: emu`) of the SD card, `<platform>` being the platform of
        the console (`tg5040`). The system paks of `.system/` are not
        listed (NextUI updates them). Hidden folders (name starting with
        `.`) and symbolic links are skipped. `sizeBytes` is the sum of the
        regular files of the folder (links are not followed), `modifiedAt`
        the modification time of the folder, `version` the `version`
        string of its `pak.json` when it has one (null otherwise or when
        unreadable). `self` is true for the pak of ReminisLink itself,
        which can be neither deleted nor replaced while it runs. Sorted
        by kind (`tool` first), then name ignoring case. Read route: never
        waits for a write.
      responses:
        '200':
          description: The installed paks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PakList' }
              example:
                paks:
                  - pakId: pk_VG9vbHMvdGc1MDQwL1JlbWluaXNMaW5rLnBhaw
                    name: ReminisLink
                    kind: tool
                    path: Tools/tg5040/ReminisLink.pak
                    sizeBytes: 9437184
                    modifiedAt: '2026-11-20T08:00:00Z'
                    version: v1.0.0
                    self: true
                  - pakId: pk_RW11cy90ZzUwNDAvTUdCQS5wYWs
                    name: MGBA
                    kind: emu
                    path: Emus/tg5040/MGBA.pak
                    sizeBytes: 4096
                    modifiedAt: '2026-11-18T17:00:00Z'
                    version: null
                    self: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /paks/{pakId}:
    delete:
      tags: [Paks]
      operationId: deletePak
      summary: Delete a pak (to the trash, M12)
      description: |
        Moves the whole folder of the pak to the ReminisLink trash (reason
        `delete-pak`, label: the pak name), as for a game: nothing is
        erased before the trash is purged. The app asks for a
        confirmation first. ReminisLink itself (`self`) is refused with
        `409 conflict` (nothing changed). Write route: it waits for the
        write in progress (see "Writes one at a time"). A `paks` event
        follows (M14).
      parameters:
        - $ref: '#/components/parameters/PakId'
      responses:
        '200':
          description: Moved to the trash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashMoveResult' }
              example:
                trashEntryId: tr_20261120T090000Z_c3d4
                moved:
                  - Tools/tg5040/Clock.pak/launch.sh
                  - Tools/tg5040/Clock.pak/pak.json
                movedBytes: 2048
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /paks/install:
    post:
      tags: [Paks]
      operationId: installPak
      summary: Install a pak from a file or folder of the SD card (creates a job, M12)
      description: |
        Installs a pak from an entry of the SD browser (`sdEntryId` of
        `GET /sd/browse`): a zip archive, or a folder whose name ends with
        `.pak` (copied as is). The other sources use the same pipeline:
        the `pak` target of `POST /uploads` (an archive sent from the
        phone; a `.pak` folder chosen on the phone is zipped by the app
        first). The pak never installs from a URL (removed from v1).

        The request is checked at once (`400`, `404` for a missing entry,
        `422 unsupported_format` for an entry that is neither a file nor a
        `.pak` folder) and a job of kind `pak-install` is queued; its
        result is `{ "pakId": "..." }`. A failed job carries in its `error`:
        `422 unsupported_format` (with an English `message` saying why),
        `409 conflict` (the pak exists and `onConflict` is `fail`, with
        `details.existing`; or the pak is ReminisLink itself, with
        `details.self: true`) or `507 insufficient_storage`.

        **Archives** (zip, stored or deflated): the pak folder is either
        at the top, `<Name>.pak/…`, or under
        `Tools/<platform>/<Name>.pak/…` or `Emus/<platform>/<Name>.pak/…`
        (the kind is then deduced; entries for another platform are
        ignored). Exactly one pak per archive, with a `launch.sh` file
        directly in its folder (names compared ignoring case, as on the
        exFAT card). Files at the top of the archive next to the pak
        folder and the `__MACOSX/` folder are ignored; any other entry
        outside the pak folder refuses the archive. **Loose archives**
        (Pak Store style): when a `launch.sh` file is at the top of the
        archive, every entry (but `__MACOSX/`) belongs to the pak, named
        after the `name` of its `pak.json` when it is a usable name, else
        after the file name of the archive (the `fileName` of the upload
        or the name of the SD entry) without `.zip`; `.pak` is added when missing and the name
        is cleaned like any file name (refused when nothing usable is
        left: `422 unsupported_format`).

        **Protections** (rule 2 of CLAUDE.md; the content itself is not
        judged, as for a ROM): an entry with an absolute path, a `..` or
        `.` component, an empty component, a backslash, a NUL or control
        character, invalid UTF-8, a component of more than 255 bytes or a
        path of more than 1024 bytes refuses the archive; so do a symbolic
        link or any entry that is neither a file nor a folder, two entries
        whose paths differ only by case (folders included), more than
        10 000 entries or a central directory of more than 4 MiB (both
        read from the end records before the directory itself), more
        than 1 GiB uncompressed (announced or real), and an entry of more
        than 1 MiB compressed more than 200 times. An archive uploaded as a
        pak is at most 1 GiB (checked on the announced
        length and on every write). Nothing is written
        outside the staging area of the pak before every check passed.

        **Kind**: `tool` installs into `Tools/<platform>/`, `emu` into
        `Emus/<platform>/`. `auto` (default): the folder of the archive
        (`Tools/` or `Emus/`), or the folder of the source on the SD card
        (a `.pak` folder already under `Tools/<platform>/` or
        `Emus/<platform>/`), else the `type` of its `pak.json` (`TOOL`,
        `EMU`), else `tool`.

        **Installation**: the pak is extracted (or copied) into the staging
        area of the pak, checked, then, holding the write lock (see "Writes
        one at a time"; the job checks again that its client was not
        revoked), the existing pak of the same name (ignoring case), if
        any, moves to the trash (reason `replace-pak`) and the staged
        folder is renamed into place, as one journaled replacement (like
        an overwritten ROM, M8): every folder is synced, any failure puts
        the old pak back and fails the job, and a power cut is finished
        (the new pak in place) or rolled back (the old pak back) when the
        pak starts again, never neither. The folder of the paks is never
        reached through a link. A `paks` event follows (M14). ReminisLink itself can be neither
        replaced nor deleted while it runs (`409 conflict`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PakInstallRequest' }
            example: { sdEntryId: se_RG93bmxvYWRzL0Nsb2NrLnBhay56aXA, kind: auto, onConflict: replace }
      responses:
        '202':
          description: Job created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
              example: { jobId: job_0123456789abcdef01234567 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /sd/browse:
    get:
      tags: [SD]
      operationId: browseSd
      summary: List a folder of the SD card (read only, M12)
      description: |
        The folders and files of one folder of the SD card: the root
        without `folderId`, else the folder named by the `sdEntryId` of a
        folder entry. Nothing outside the SD card is reachable and no
        link is followed: symbolic links (and entries that are neither a
        file nor a folder) are not listed, and an identifier whose path
        goes through one is refused. Hidden files (name starting with `.`)
        are listed. The data of ReminisLink is never listed nor reachable
        (`404 not_found`): its folder (`.userdata/shared/ReminisLink/`:
        client keys, TLS key, trash, staging, backups) and its log files.
        Folders first, then files, by name ignoring case; at most 5000
        entries (`truncated: true` beyond). An identifier that is not a
        folder (any more) gets `404`; one that cannot be decoded, or names
        a path outside the card, `400 invalid_id`. Read route: never waits
        for a write.
      parameters:
        - name: folderId
          in: query
          required: false
          description: '`sdEntryId` of a folder; absent for the root of the SD card.'
          schema: { $ref: '#/components/schemas/OpaqueId' }
          example: se_VG9vbHM
      responses:
        '200':
          description: The folder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SdFolder' }
              example:
                folderId: se_VG9vbHM
                path: Tools
                parentId: null
                entries:
                  - { sdEntryId: se_VG9vbHMvdGc1MDQw, name: tg5040, kind: folder, sizeBytes: null, modifiedAt: '2026-11-18T17:00:00Z' }
                  - { sdEntryId: se_VG9vbHMvUkVBRE1FLnR4dA, name: README.txt, kind: file, sizeBytes: 512, modifiedAt: '2026-11-18T17:00:00Z' }
                truncated: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /sd/browse/{sdEntryId}/content:
    get:
      tags: [SD]
      operationId: downloadSdFile
      summary: Download a file of the SD card (M12)
      description: |
        Streams a whole file listed by `GET /sd/browse`, like
        `GET /games/{gameId}/files/{fileId}` (no `Range`, `Content-Length`
        set). A folder, a symbolic link, a path reached through one, a
        missing file and the data of ReminisLink get `404 not_found`.
        Read route: never waits for a write.
      parameters:
        - name: sdEntryId
          in: path
          required: true
          description: '`sdEntryId` of a file entry.'
          schema: { $ref: '#/components/schemas/OpaqueId' }
          example: se_VG9vbHMvUkVBRE1FLnR4dA
      responses:
        '200':
          description: The file.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
          content:
            application/octet-stream:
              schema: { $ref: '#/components/schemas/Binary' }
              example: '<binary file content>'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

components:
  securitySchemes:
    rlClient:
      type: apiKey
      in: header
      name: X-RL-Client
      description: '`clientId` of the paired app (lowercase UUID). Part of the RL2-ED25519 signature, see the API description.'
    rlTime:
      type: apiKey
      in: header
      name: X-RL-Time
      description: Unix time in seconds, decimal without sign nor leading zero. Must be within 300 s of the device clock.
    rlNonce:
      type: apiKey
      in: header
      name: X-RL-Nonce
      description: 16 random bytes in base64url without padding, unique per request (remembered 10 minutes).
    rlContentSha256:
      type: apiKey
      in: header
      name: X-RL-Content-SHA256
      description: Lowercase hex SHA-256 of the body (SHA-256 of the empty string for no body); `UNSIGNED` only on `PUT /uploads/{uploadId}`.
    rlSignature:
      type: apiKey
      in: header
      name: X-RL-Signature
      description: base64url (no padding) of the 64-byte Ed25519 signature of the canonical string (first line `RL2-ED25519`) by the client's private key; the pak verifies it with the public key registered at pairing.

  parameters:
    SystemId:
      name: systemId
      in: path
      required: true
      description: System identifier (opaque).
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKQ
    GameId:
      name: gameId
      in: path
      required: true
      description: Game identifier (opaque).
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Ta3kgR2FyZGVuIFF1ZXN0LmdiYQ
    BackupId:
      name: backupId
      in: path
      required: true
      description: Save backup identifier.
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: bk_20261118T170000Z_a1b2
    Slot:
      name: slot
      in: path
      required: true
      description: State slot number.
      schema: { type: integer, minimum: 0 }
      example: 0
    UploadId:
      name: uploadId
      in: path
      required: true
      description: Upload identifier.
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: up_01JD3X5V7Q9W
    JobId:
      name: jobId
      in: path
      required: true
      description: Job identifier.
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: job_01JD3Y0A2B3C
    PakId:
      name: pakId
      in: path
      required: true
      description: Pak identifier (opaque, from `GET /paks`).
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: pk_VG9vbHMvdGc1MDQwL0Nsb2NrLnBhaw
    StagingId:
      name: stagingId
      in: path
      required: true
      description: Staging entry (`stagingId` returned by the completion of a `staging` upload).
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: st_20261121T100000Z_0a1b2c3d
    ConfirmEmptyTrash:
      name: X-RL-Confirm
      in: header
      required: true
      description: Explicit confirmation of a permanent deletion. Without it, `400 invalid_request`.
      schema: { type: string, const: empty-trash }
      example: empty-trash

  headers:
    ETag:
      description: Entity tag of the resource.
      schema: { type: string }
    ContentDisposition:
      description: '`attachment; filename="<name>"`.'
      schema: { type: string }

  responses:
    BadRequest:
      description: '`invalid_request` (bad JSON, missing field, missing confirmation, body unreadable or truncated), `invalid_id` or `invalid_name`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: invalid_id, message: Invalid identifier, details: {} } }
    Unauthorized:
      description: Authentication failed (`unknown_client`, `bad_signature`, `clock_skew`, `replayed_request`), or the client was disconnected by the console (`disconnected`, M10; lifted by `POST /clients/me/connect`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: clock_skew, message: Request time is too far from the device time, details: {} } }
    PairingFailed:
      description: Wrong proof or expired secret (`pairing_failed`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: pairing_failed, message: Pairing failed, details: {} } }
    NotFound:
      description: Resource not found (`not_found`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: not_found, message: Game not found, details: {} } }
    Conflict:
      description: |
        `conflict` (target exists: `details.existing`; wrong upload offset:
        `details.offset`; M12: deleting or replacing the pak of ReminisLink
        itself, `details.self: true`), `checksum_mismatch` or `state_locked`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: conflict, message: Unexpected upload offset, details: { offset: 12582912 } } }
    PreconditionFailed:
      description: The resource changed since the given ETag (code `conflict`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: conflict, message: Cheat file changed, details: {} } }
    TooLarge:
      description: Body or file too large (`too_large`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: too_large, message: Body too large, details: {} } }
    Unprocessable:
      description: |
        `unsupported_format` or `patch_mismatch`. On the save and state routes
        and the `save`/`state` upload targets, `unsupported_format` means the
        console uses a save or state format the pak does not write (a
        non-default `saveFormat`/`stateFormat` in the NextUI settings, or a
        `.zip` game with `useExtractedFileName=1`, whose data is named after
        the file inside the zip), or the state folder of the system cannot
        be found (no emulator pak, or an emulator pak whose core the pak
        cannot read from its `launch.sh`, M8): the pak refuses to change
        these files rather than guess. On `PUT /games/{gameId}/art`, the
        body is not a valid PNG of at most 1024 x 1024 pixels. On
        `POST /paks/install` and in the error of a pak installation job
        (M12): the source is not a zip archive nor a `.pak` folder, or it
        breaks a rule of the archives (the English `message` says which).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: unsupported_format, message: No cheat found, details: {} } }
    TooManyAttempts:
      description: Pairing blocked or rate limit reached (`too_many_attempts`).
      headers:
        Retry-After:
          description: Seconds before trying again.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: too_many_attempts, message: Pairing is blocked, details: {} } }
    TooManyRequests:
      description: |
        The device cannot take this request right now (`too_many_attempts`
        or `device_busy`, always with `Retry-After`). Retry later. Cases: its cache of recent
        request nonces is full (it never forgets a live nonce to make room);
        too many open uploads (32, message `Too many open uploads`) on
        `POST /uploads`; too many queued and running jobs (100, message
        `Too many jobs`) on `POST /games/{gameId}/patch`,
        `POST /paks/install` and the completion of a `pak` upload; an upload resumed after a
        restart of the pak is still being verified (message `Upload is
        being verified`) on `PUT /uploads/{uploadId}` and
        `POST /uploads/{uploadId}/complete`; more than 4 event streams
        for the client or 16 in all on `GET /events` (M14, message `Too many
        event streams`). On every route that changes the SD card, a write
        that waited 10 s for the write in progress gets the code
        `device_busy` instead (message `Device busy`, nothing was changed;
        see "Writes one at a time"); a pak from M13 sent `too_many_attempts`
        with the same message.
      headers:
        Retry-After:
          description: Seconds before trying again.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            tooManyAttempts:
              value: { error: { code: too_many_attempts, message: Too many requests, details: {} } }
            deviceBusy:
              value: { error: { code: device_busy, message: Device busy, details: {} } }
    Internal:
      description: Unexpected error (`internal`); details are in the device log.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: internal, message: Internal error, details: {} } }
    ShuttingDown:
      description: The pak is closing (`shutting_down`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: shutting_down, message: Shutting down, details: {} } }
    InsufficientStorage:
      description: Not enough free space (`insufficient_storage`, `details.required`, `details.available`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: insufficient_storage, message: Not enough free space, details: { required: 35232153, available: 1048576 } } }

  schemas:
    OpaqueId:
      type: string
      description: Opaque identifier, sent back exactly as received.
      minLength: 1
      pattern: '^[A-Za-z0-9_-]+$'
    Uuid:
      type: string
      description: Lowercase hyphenated UUID.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    B64U32:
      type: string
      description: 32 bytes in base64url without padding.
      pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
    Sha256Hex:
      type: string
      description: Lowercase hex SHA-256.
      pattern: '^[0-9a-f]{64}$'
    Bytes:
      type: integer
      format: int64
      minimum: 0
      description: Size in bytes.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC.
    Binary:
      type: string
      contentMediaType: application/octet-stream
    FileName:
      type: string
      description: File name without directory; normalized to Unicode NFC, then cleaned by the device (`invalid_name` if refused). At most 255 bytes.
      minLength: 1
    Model:
      type: string
      enum: [brick, brickpro, smartpro, smartpros, h700, my355, desktop]

    ErrorCode:
      type: string
      enum:
        - invalid_request
        - invalid_id
        - invalid_name
        - unknown_client
        - bad_signature
        - clock_skew
        - replayed_request
        - pairing_failed
        - not_found
        - conflict
        - checksum_mismatch
        - state_locked
        - too_large
        - unsupported_format
        - patch_mismatch
        - too_many_attempts
        - device_busy
        - internal
        - shutting_down
        - insufficient_storage
        - disconnected
    ErrorBody:
      type: object
      required: [code, message, details]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: 'English, for logs.' }
        details:
          type: object
          description: Extra data depending on `code` (`existing`, `offset`, `required`, `available`...).
          additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }

    Hello:
      type: object
      required: [deviceId, deviceName, model, platform, os, osVersion, pakVersion, apiVersion, minClientVersion, serverTime, pairingOpen]
      properties:
        deviceId: { $ref: '#/components/schemas/Uuid' }
        deviceName: { type: string }
        model: { $ref: '#/components/schemas/Model' }
        platform: { type: string, description: 'NextUI platform, e.g. `tg5040`.' }
        os: { type: string, description: 'For example `nextui`.' }
        osVersion:
          type: [string, 'null']
          description: 'OS release as NextUI shows it (lines of `.system/version.txt` joined), e.g. `NextUI-20261013-039a06de`; null when unknown.'
        pakVersion:
          type: string
          description: 'Version of the pak: its tag without the `v` (e.g. `1.0.1`, `1.1.0-beta.1`); `dev` or a commit hash for a development build. Compared with the app''s `minPakVersion` (M17).'
        apiVersion: { type: integer, minimum: 1, description: '2 since M13 (TLS, pairing v2, RL2-ED25519).' }
        minClientVersion:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
          description: 'Oldest client protocol version (`X.Y.Z`) this pak supports, the same for every client and not an app store version; each client compares it with its own protocol version constant (M17). `1.0.0` for paks v1.0.x.'
        serverTime: { $ref: '#/components/schemas/Timestamp' }
        pairingOpen: { type: boolean }
    PairRequest:
      type: object
      required: [clientId, clientName, platform, clientPublicKey, clientNonce, proof]
      properties:
        clientId: { $ref: '#/components/schemas/Uuid' }
        clientName: { type: string, minLength: 1, maxLength: 64, description: Name typed by the user at pairing (shown on the console). }
        platform: { $ref: '#/components/schemas/ClientPlatform' }
        clientPublicKey:
          allOf: [{ $ref: '#/components/schemas/B64U32' }]
          description: The client's Ed25519 public key (32 raw bytes), base64url.
        clientNonce:
          allOf: [{ $ref: '#/components/schemas/B64U32' }]
          description: 32 random bytes, base64url.
        proof:
          allOf: [{ $ref: '#/components/schemas/B64U32' }]
          description: b64u(HMAC-SHA256(secret, `RL2-PAIR-CLIENT|` + deviceId + `|` + clientId + `|` + clientPublicKey + `|` + clientNonce)).
    ClientPlatform:
      type: string
      enum: [apple, android, web, other]
      description: Kind of paired client. `apple` is an identity shared by the Apple devices of one account (iCloud Keychain).
    PairResponse:
      type: object
      required: [deviceId, deviceName, deviceNonce, proof]
      properties:
        deviceId: { $ref: '#/components/schemas/Uuid' }
        deviceName: { type: string }
        deviceNonce:
          allOf: [{ $ref: '#/components/schemas/B64U32' }]
          description: 32 random bytes, base64url.
        proof:
          allOf: [{ $ref: '#/components/schemas/B64U32' }]
          description: b64u(HMAC-SHA256(secret, `RL2-PAIR-DEVICE|` + deviceId + `|` + clientId + `|` + clientPublicKey + `|` + clientNonce + `|` + deviceNonce)).
    Device:
      type: object
      required: [deviceId, deviceName, model, platform, os, osVersion, pakVersion, network, battery, storage, uptimeSeconds, connectedClients]
      properties:
        deviceId: { $ref: '#/components/schemas/Uuid' }
        deviceName: { type: string }
        model: { $ref: '#/components/schemas/Model' }
        platform: { type: string }
        os: { type: string }
        osVersion:
          type: [string, 'null']
          description: 'OS release as NextUI shows it (lines of `.system/version.txt` joined), e.g. `NextUI-20261013-039a06de`; null when unknown.'
        pakVersion: { type: string }
        network:
          type: object
          required: [ipv4, ssid]
          properties:
            ipv4: { type: string, format: ipv4 }
            ssid: { type: [string, 'null'] }
        battery:
          type: [object, 'null']
          required: [percent, charging]
          properties:
            percent: { type: integer, minimum: 0, maximum: 100 }
            charging: { type: boolean }
        storage:
          type: array
          items: { $ref: '#/components/schemas/Storage' }
        uptimeSeconds: { type: integer, format: int64, minimum: 0 }
        connectedClients:
          type: array
          description: Paired clients with a signed request accepted in the last 30 seconds or an open event stream (M14), caller included. In memory only.
          items: { $ref: '#/components/schemas/ConnectedClient' }
    ConnectedClient:
      type: object
      required: [clientName, lastSeenAt]
      properties:
        clientName: { type: string }
        lastSeenAt: { $ref: '#/components/schemas/Timestamp' }
    Storage:
      type: object
      required: [id, label, totalBytes, freeBytes]
      properties:
        id: { type: string }
        label: { type: string }
        totalBytes: { $ref: '#/components/schemas/Bytes' }
        freeBytes: { $ref: '#/components/schemas/Bytes' }

    System:
      type: object
      required: [id, label, folder, tag, gameCount, emulatorInstalled]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        label: { type: string, description: Folder name without the sort prefix nor the tag. }
        folder: { type: string }
        tag: { type: string }
        gameCount: { type: integer, minimum: 0 }
        emulatorInstalled:
          type: boolean
          description: |
            An emulator pak for the tag exists: `<SD>/Emus/<platform>/<TAG>.pak`
            or `<SD>/.system/<platform>/paks/Emus/<TAG>.pak`. NextUI shows the
            system only when it is true.
    SystemList:
      type: object
      required: [systems]
      properties:
        systems:
          type: array
          items: { $ref: '#/components/schemas/System' }
    Folder:
      type: object
      required: [id, name, gameCount]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        name: { type: string }
        gameCount: { type: integer, minimum: 0 }
    GameKind:
      type: string
      enum: [file, m3u, folder-m3u, folder-cue]
      description: |
        `file` (single ROM), `m3u` (`.m3u` file), `folder-m3u` (folder
        holding a `.m3u` of the same name), `folder-cue` (M8: folder holding
        a `.cue` of the same name and no such `.m3u`; NextUI launches the
        `.cue`, and the save and states are named after it). Clients must
        treat an unknown kind like `folder-m3u`.
    Game:
      type: object
      required: [id, name, fileName, kind, sizeBytes, modifiedAt, hasSave, stateCount, lockedStateCount, cheatCount, hasArt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        name: { type: string }
        fileName: { type: string }
        kind: { $ref: '#/components/schemas/GameKind' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        modifiedAt: { $ref: '#/components/schemas/Timestamp' }
        hasSave: { type: boolean }
        stateCount: { type: integer, minimum: 0 }
        lockedStateCount: { type: integer, minimum: 0 }
        cheatCount: { type: integer, minimum: 0 }
        hasArt: { type: boolean }
    EventHello:
      type: object
      required: [serverTime, keepAliveSeconds]
      properties:
        serverTime: { $ref: '#/components/schemas/Timestamp' }
        keepAliveSeconds: { type: integer, minimum: 1, description: Longest gap between two keep-alives (15). }
    EventShutdown:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [quit, stopped], description: '`quit`: the user left ReminisLink on the console; `stopped`: the system stopped the pak (power off, signal).' }
    EventDevice:
      type: object
      required: [battery, connectedClients, storage]
      properties:
        battery:
          type: [object, 'null']
          required: [percent, charging]
          properties:
            percent: { type: integer, minimum: 0, maximum: 100 }
            charging: { type: boolean }
        connectedClients:
          type: array
          items: { $ref: '#/components/schemas/ConnectedClient' }
        storage:
          type: array
          items: { $ref: '#/components/schemas/Storage' }
    EventLibrary:
      type: object
      required: [systemIds]
      properties:
        systemIds:
          type: array
          description: Systems whose games changed; empty when unknown (refresh everything).
          items: { $ref: '#/components/schemas/OpaqueId' }
    LibraryGame:
      allOf:
        - { $ref: '#/components/schemas/Game' }
        - type: object
          required: [systemId, folderId, folderPath]
          properties:
            systemId: { $ref: '#/components/schemas/OpaqueId' }
            folderId:
              type: [string, 'null']
              description: Folder of the system that holds the game (as in `GET /systems/{systemId}/games`), null at the root.
            folderPath:
              type: [string, 'null']
              description: 'Informative, folder names below the system joined with `/`; null at the root.'
    AllGames:
      type: object
      required: [games, truncated, generatedAt]
      properties:
        games:
          type: array
          items: { $ref: '#/components/schemas/LibraryGame' }
        truncated: { type: boolean }
        generatedAt: { $ref: '#/components/schemas/Timestamp' }
    GameListing:
      type: object
      required: [folders, games]
      properties:
        folders:
          type: array
          items: { $ref: '#/components/schemas/Folder' }
        games:
          type: array
          items: { $ref: '#/components/schemas/Game' }
    GameFile:
      type: object
      required: [fileId, role, path, sizeBytes, modifiedAt]
      properties:
        fileId:
          $ref: '#/components/schemas/OpaqueId'
          description: 'M11: identifies this file for `GET /games/{gameId}/files/{fileId}`. Stable while the file keeps its path.'
        role:
          type: string
          enum: [rom, save, rtc, state, cheats, art]
          description: '`rtc`: the clock file NextUI writes next to the save (`Saves/<TAG>/<rom>.rtc`), counted in `totalBytes`.'
        slot: { type: integer, minimum: 0, description: Only for `state`. }
        path: { type: string, description: 'Informative, relative to the SD card root. Never sent back.' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        modifiedAt: { $ref: '#/components/schemas/Timestamp' }
    GameDetail:
      type: object
      required: [id, systemId, name, fileName, kind, files, totalBytes]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        systemId: { $ref: '#/components/schemas/OpaqueId' }
        name: { type: string }
        fileName: { type: string }
        kind: { $ref: '#/components/schemas/GameKind' }
        files:
          type: array
          items: { $ref: '#/components/schemas/GameFile' }
        totalBytes: { $ref: '#/components/schemas/Bytes' }

    DeletionItem:
      type: object
      required: [name, role, size]
      properties:
        name: { type: string, description: 'Informative path, never absolute (see `GET /games/{gameId}/deletion`).' }
        role:
          type: string
          enum: [rom, save, rtc, state, cheats, art, other]
          description: 'The roles of `GameFile`; `other` for the rest (side files of the states, `.cht.bak`, files of a folder game not listed by its playlist, ReminisLink copies).'
        size: { $ref: '#/components/schemas/Bytes' }
    DeletionPreview:
      type: object
      required: [moved, kept, movedBytes]
      properties:
        moved:
          type: array
          items: { $ref: '#/components/schemas/DeletionItem' }
        kept:
          type: array
          items: { $ref: '#/components/schemas/DeletionItem' }
        movedBytes: { $ref: '#/components/schemas/Bytes' }
    TrashMoveResult:
      type: object
      required: [trashEntryId, moved, movedBytes]
      properties:
        trashEntryId: { $ref: '#/components/schemas/OpaqueId' }
        moved:
          type: array
          description: Original paths, relative to the SD card root (informative).
          items: { type: string }
        movedBytes: { $ref: '#/components/schemas/Bytes' }
    TrashEntry:
      type: object
      required: [id, trashedAt, reason, label, files, sizeBytes, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        trashedAt:
          $ref: '#/components/schemas/Timestamp'
          description: Wall clock time of the console when the entry was made (informative; the console clock may be wrong).
        reason:
          type: string
          enum: [delete-game, delete-state, overwrite, replace-rom, lock-restore, restore, delete-backup, delete-pak, replace-pak, import-archive]
          description: |
            `delete-backup`: a save backup deleted by the app or pushed out by
            the automatic limits (10 automatic backups per game, 5 resume
            history entries), never erased directly. `delete-pak` and
            `replace-pak` (M12): a pak folder deleted (`DELETE /paks/{pakId}`)
            or replaced by an installation. `import-archive` (M19): the files
            of a game replaced by the import of a game archive. Clients show
            an unknown reason as a generic entry.
        label: { type: string }
        files:
          type: array
          items: { type: string }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: |
            Earliest time the entry can be purged, an estimate: the current
            console time plus 30 days minus the credited age of the entry,
            never in the past. The credited age only grows while the pak
            runs and by at most 7 days per launch, so the real purge can come
            later, never earlier.
    TrashList:
      type: object
      required: [entries, totalBytes]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/TrashEntry' }
        totalBytes: { $ref: '#/components/schemas/Bytes' }
    FreedBytes:
      type: object
      required: [freedBytes]
      properties:
        freedBytes: { $ref: '#/components/schemas/Bytes' }

    Backup:
      type: object
      required: [id, label, createdAt, sizeBytes, reason]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        label: { type: [string, 'null'], maxLength: 80 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        reason:
          type: string
          enum: [manual, before-replace, before-restore, before-delete, before-patch, before-import]
          description: '`before-import` (M19): the save before the import of a game archive.'
    BackupList:
      type: object
      required: [backups]
      properties:
        backups:
          type: array
          items: { $ref: '#/components/schemas/Backup' }
    BackupResult:
      type: object
      required: [backup]
      properties:
        backup:
          oneOf:
            - $ref: '#/components/schemas/Backup'
            - type: 'null'
    CreateBackupRequest:
      type: object
      properties:
        label: { type: string, maxLength: 80 }
    SaveClockFile:
      type: object
      required: [path, sizeBytes, modifiedAt, sha256]
      properties:
        path: { type: string, description: 'Informative, relative to the SD card root. Never sent back.' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        modifiedAt: { $ref: '#/components/schemas/Timestamp' }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
    SaveSummary:
      type: object
      required: [gameId, systemId, gameName, fileName, path, sizeBytes, modifiedAt, sha256, rtc]
      properties:
        gameId: { $ref: '#/components/schemas/OpaqueId' }
        systemId: { $ref: '#/components/schemas/OpaqueId' }
        gameName: { type: string, description: 'Display name of the game (`name` of `Game`).' }
        fileName: { type: string, description: '`fileName` of the game (ROM file, `.m3u` or folder name).' }
        path: { type: string, description: 'Informative, relative to the SD card root. Never sent back.' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        modifiedAt: { $ref: '#/components/schemas/Timestamp' }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
        rtc:
          description: The clock file of the save, null when there is none.
          oneOf:
            - $ref: '#/components/schemas/SaveClockFile'
            - type: 'null'
    SaveList:
      type: object
      required: [saves, truncated, generatedAt]
      properties:
        saves:
          type: array
          items: { $ref: '#/components/schemas/SaveSummary' }
        truncated: { type: boolean, description: 'More than 10000 saves: the list is incomplete.' }
        generatedAt: { $ref: '#/components/schemas/Timestamp' }

    StateThumbnailFile:
      type: object
      required: [sizeBytes, sha256]
      properties:
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
    StateSummary:
      type: object
      required: [gameId, systemId, gameName, fileName, slot, path, sizeBytes, modifiedAt, sha256, thumbnail]
      properties:
        gameId: { $ref: '#/components/schemas/OpaqueId' }
        systemId: { $ref: '#/components/schemas/OpaqueId' }
        gameName: { type: string, description: 'Display name of the game (`name` of `Game`).' }
        fileName: { type: string, description: '`fileName` of the game.' }
        slot: { type: integer, minimum: 0, maximum: 99 }
        path: { type: string, description: 'Informative, relative to the SD card root. Never sent back.' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        modifiedAt: { $ref: '#/components/schemas/Timestamp' }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
        thumbnail:
          description: The thumbnail of the state (a PNG), null when there is none.
          oneOf:
            - $ref: '#/components/schemas/StateThumbnailFile'
            - type: 'null'
    StateList:
      type: object
      required: [states, truncated, generatedAt]
      properties:
        states:
          type: array
          items: { $ref: '#/components/schemas/StateSummary' }
        truncated: { type: boolean, description: 'More than 20000 states: the list is incomplete.' }
        generatedAt: { $ref: '#/components/schemas/Timestamp' }

    ArchiveRole:
      type: string
      enum: [save, rtc, state, state-thumbnail, cheats, art, rom]
      description: What a file of a game archive is; an importer maps it by role, never by its path.
    GameArchiveSource:
      type: object
      required: [os, systemTag, systemLabel, gameName, fileName, romName, kind]
      description: Where the archive comes from (informative; used to suggest a target).
      properties:
        deviceName: { type: [string, 'null'] }
        os: { type: string, description: '`os` of `GET /hello` (`nextui`).' }
        platform: { type: [string, 'null'] }
        pakVersion: { type: [string, 'null'] }
        systemTag: { type: string, description: 'Tag of the system folder (`GBA`).' }
        systemLabel: { type: string }
        gameName: { type: string }
        fileName: { type: string, description: '`fileName` of the game; the file name of a new game made from the ROM.' }
        romName: { type: string, description: 'The file the data were named after (ROM, `.m3u` or `.cue`).' }
        kind: { type: string, description: '`kind` of the game (`file`, `m3u`, `folder-m3u`, `folder-cue`).' }
    GameArchiveFile:
      type: object
      required: [path, role, sizeBytes, sha256]
      properties:
        path: { type: string, description: 'Entry path in the zip (informative, checked).' }
        role: { $ref: '#/components/schemas/ArchiveRole' }
        slot: { type: integer, minimum: 0, maximum: 99, description: '`state` and `state-thumbnail` only.' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
    GameArchiveManifest:
      type: object
      required: [format, version, createdAt, source, files]
      description: '`manifest.json` of a game archive (M19). Readers ignore unknown fields.'
      properties:
        format: { type: string, const: reminislink-game-archive }
        version: { type: integer, minimum: 1, description: 'Format version: 1. An importer refuses a higher version.' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        source: { $ref: '#/components/schemas/GameArchiveSource' }
        files:
          type: array
          items: { $ref: '#/components/schemas/GameArchiveFile' }
    ArchiveTarget:
      type: object
      description: 'Where to import: `gameId` (an existing game), or `systemId` and an optional `folderId` (a new game made from the ROM). Exactly one of `gameId` and `systemId`.'
      properties:
        gameId: { $ref: '#/components/schemas/OpaqueId' }
        systemId: { $ref: '#/components/schemas/OpaqueId' }
        folderId:
          oneOf:
            - $ref: '#/components/schemas/OpaqueId'
            - type: 'null'
    ArchivePlanEntry:
      type: object
      required: [role, slot, sizeBytes, action, reason]
      properties:
        role: { $ref: '#/components/schemas/ArchiveRole' }
        slot: { type: [integer, 'null'], minimum: 0, maximum: 99 }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        action: { type: string, enum: [create, replace, skip] }
        reason:
          type: [string, 'null']
          enum: [game-exists, locked, unsupported-format, no-state-folder, no-state, no-target, null]
          description: Why a file is skipped; null otherwise. Clients show an unknown reason as skipped.
    ArchivePlan:
      type: object
      required: [manifest, target, targetName, suggested, entries, importBytes]
      properties:
        manifest: { $ref: '#/components/schemas/GameArchiveManifest' }
        target:
          description: The target used (given or suggested), null when none fits.
          oneOf:
            - $ref: '#/components/schemas/ArchiveTarget'
            - type: 'null'
        targetName:
          type: [string, 'null']
          description: The name of the target game, or the label of the target system for a new game.
        suggested: { type: boolean, description: 'The pak chose the target (none was given).' }
        entries:
          type: array
          items: { $ref: '#/components/schemas/ArchivePlanEntry' }
        importBytes:
          $ref: '#/components/schemas/Bytes'
          description: Bytes of the files that would be imported (not skipped).
    ArchiveImportRequest:
      type: object
      required: [target]
      properties:
        target: { $ref: '#/components/schemas/ArchiveTarget' }

    Slot:
      type: object
      required: [slot, sizeBytes, modifiedAt, hasThumbnail, locked, lockStatus]
      properties:
        slot: { type: integer, minimum: 0 }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        modifiedAt: { $ref: '#/components/schemas/Timestamp' }
        hasThumbnail: { type: boolean }
        locked: { type: boolean }
        lockStatus:
          type: [string, 'null']
          enum: [intact, restored, missing, modified, core-changed, null]
          description: |
            null when not locked. `intact`: the state holds the bytes of the
            locked copy (recorded size and date, SHA-256 when they differ).
            `restored`: it was overwritten or removed in game and the copy was
            put back at pak start (reported once, then `intact`). `missing`:
            the state is gone, the copy is still locked. `modified`: the state
            differs from the copy and was not restored (check skipped by the
            time limit, damaged copy, unsupported state format, game no longer
            found, state folder of the copy or of the system unknown: such a
            lock is never restored until it is locked again). `core-changed`: the copy comes from the state folder of
            another emulator core (`<TAG>-<core>`) than the current one; it is
            never restored there (restore answers `409 conflict`).
    SlotList:
      type: object
      required: [slots, resumeSlot]
      properties:
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }
        resumeSlot:
          type: [integer, 'null']
          minimum: 0
          description: |
            Slot of the automatic resume state (9 on NextUI, written when the
            console sleeps or is turned off in game), null when the OS has none
            or uses a non-default state format.
    ResumeHistoryEntry:
      type: object
      required: [id, capturedAt, sizeBytes]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        capturedAt: { $ref: '#/components/schemas/Timestamp' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
    ResumeHistory:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/ResumeHistoryEntry' }

    Cheat:
      type: object
      required: [description, code, enabled]
      properties:
        index: { type: integer, minimum: 0, description: Position in the file (cheats are renumbered on write). }
        description: { type: string }
        code: { type: string }
        enabled: { type: boolean }
        extra:
          type: object
          description: |
            Unknown `.cht` keys of this cheat, kept as is, without the
            `cheat<index>_` prefix of **this** cheat (`handler` for
            `cheat0_handler`, `cheat1_x` for `cheat0_cheat1_x`). The pak adds
            the prefix of the cheat's position on write, so a key always
            follows its cheat when the list is reordered. A key received is
            used as it is: no prefix is ever removed from it. Keys are
            `[A-Za-z0-9_]+` and never `desc`, `code` or `enable`
            (`400 invalid_request`).
          additionalProperties: { type: string }
    CheatList:
      type: object
      required: [cheats, etag]
      properties:
        cheats:
          type: array
          items: { $ref: '#/components/schemas/Cheat' }
        etag: { type: string }
    CheatsUpdate:
      type: object
      required: [cheats]
      properties:
        cheats:
          type: array
          items: { $ref: '#/components/schemas/Cheat' }
    CheatImportRequest:
      type: object
      required: [source, mode]
      properties:
        source:
          oneOf:
            - type: object
              required: [type, sdFileId]
              properties:
                type: { type: string, const: sd }
                sdFileId: { $ref: '#/components/schemas/OpaqueId' }
            - type: object
              required: [type, text]
              properties:
                type: { type: string, const: inline }
                text: { type: string }
            - type: object
              required: [type, uploadId]
              properties:
                type: { type: string, const: upload }
                uploadId: { $ref: '#/components/schemas/OpaqueId' }
            - type: object
              required: [type, stagingId]
              properties:
                type: { type: string, const: staging }
                stagingId: { $ref: '#/components/schemas/OpaqueId' }
        mode: { type: string, enum: [merge, replace] }
    CheatImportResult:
      type: object
      required: [imported, total]
      properties:
        imported: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    SdFile:
      type: object
      required: [id, path, sizeBytes]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        path: { type: string, description: 'Informative, relative to the SD card root.' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
    SdFileList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/SdFile' }

    OnConflict:
      type: string
      description: Only for the `rom`, `staging` and `pak` targets (`pak` accepts `fail` and `overwrite` only, M12). `save` always replaces the existing save after copying it as a `before-replace` backup; `state` always replaces the existing state after moving it to the trash (refused when the slot is locked).
      enum: [fail, rename, overwrite]
      default: fail
    UploadTarget:
      description: Destination of an upload.
      oneOf:
        - type: object
          required: [kind, systemId, fileName]
          properties:
            kind: { type: string, const: rom }
            systemId: { $ref: '#/components/schemas/OpaqueId' }
            folderId:
              oneOf:
                - $ref: '#/components/schemas/OpaqueId'
                - type: 'null'
            fileName: { $ref: '#/components/schemas/FileName' }
        - type: object
          required: [kind, gameId]
          description: |
            The save of a game. The previous save is kept as a `before-replace`
            backup (returned by `complete`), as with `PUT /games/{gameId}/save`.
          properties:
            kind: { type: string, const: save }
            gameId: { $ref: '#/components/schemas/OpaqueId' }
        - type: object
          required: [kind, gameId, slot]
          description: |
            A state slot of a game. The previous state and its NextUI
            thumbnail go to the trash; the disc file of the slot
            (`.minui/<TAG>/<rom>.<N>.txt`, multi-disc games) stays in place:
            the user knows which disc the uploaded state belongs to.
          properties:
            kind: { type: string, const: state }
            gameId: { $ref: '#/components/schemas/OpaqueId' }
            slot: { type: integer, minimum: 0 }
        - type: object
          required: [kind, fileName]
          properties:
            kind: { type: string, const: staging }
            fileName: { $ref: '#/components/schemas/FileName' }
        - type: object
          required: [kind]
          description: |
            M12: a pak archive (zip) to install, see `POST /paks/install`.
            `complete` answers `{ "jobId": "..." }` (a `pak-install` job).
            `fileName` is the name of the archive: shown on the console,
            and the fallback name of a loose archive (`launch.sh` at its
            top) whose `pak.json` has no usable `name` (`.zip` dropped,
            `.pak` added, cleaned); otherwise the installed name comes from
            the archive.
          properties:
            kind: { type: string, const: pak }
            pakKind: { $ref: '#/components/schemas/PakInstallKind' }
            fileName: { $ref: '#/components/schemas/FileName' }
    CreateUploadRequest:
      type: object
      required: [target, sizeBytes, sha256]
      properties:
        target: { $ref: '#/components/schemas/UploadTarget' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
        onConflict: { $ref: '#/components/schemas/OnConflict' }
    UploadCreated:
      type: object
      required: [uploadId, chunkSize, offset, expiresAt]
      properties:
        uploadId: { $ref: '#/components/schemas/OpaqueId' }
        chunkSize: { type: integer, format: int64, minimum: 1, maximum: 16777216 }
        offset: { $ref: '#/components/schemas/Bytes' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    UploadStatus:
      type: object
      required: [uploadId, offset, sizeBytes]
      properties:
        uploadId: { $ref: '#/components/schemas/OpaqueId' }
        offset: { $ref: '#/components/schemas/Bytes' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
    UploadResult:
      description: Depends on `target.kind`.
      oneOf:
        - type: object
          required: [gameId]
          properties:
            gameId: { $ref: '#/components/schemas/OpaqueId' }
        - $ref: '#/components/schemas/BackupResult'
        - type: object
          required: [slot]
          properties:
            slot: { $ref: '#/components/schemas/Slot' }
        - type: object
          required: [stagingId]
          properties:
            stagingId: { $ref: '#/components/schemas/OpaqueId' }
        - type: object
          required: [jobId]
          description: 'M12, `pak` target: the `pak-install` job that installs the archive.'
          properties:
            jobId: { $ref: '#/components/schemas/OpaqueId' }
    PatchRequest:
      type: object
      required: [patch]
      properties:
        patch:
          oneOf:
            - type: object
              required: [type, stagingId]
              properties:
                type: { type: string, const: staging }
                stagingId: { $ref: '#/components/schemas/OpaqueId' }
            - type: object
              required: [type, sdFileId]
              properties:
                type: { type: string, const: sd }
                sdFileId: { $ref: '#/components/schemas/OpaqueId' }
        output:
          type: object
          properties:
            mode: { type: string, enum: [new-file, replace], default: new-file }
            fileName: { $ref: '#/components/schemas/FileName' }
    JobAccepted:
      type: object
      required: [jobId]
      properties:
        jobId: { $ref: '#/components/schemas/OpaqueId' }
    Job:
      type: object
      required: [id, kind, state, progress, createdAt, updatedAt, result, error]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        kind:
          type: string
          enum: [patch, pak-install, archive-import]
          description: '`pak-install` (M12): `POST /paks/install`, or the completion of a `pak` upload. `archive-import` (M19): `POST /archives/{stagingId}/import`. Clients keep an unknown kind.'
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        progress:
          type: object
          required: [done, total]
          properties:
            done: { $ref: '#/components/schemas/Bytes' }
            total:
              type: [integer, 'null']
              format: int64
              minimum: 0
              description: Null when unknown.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        result:
          type: [object, 'null']
          description: "The created resource when `succeeded`, e.g. `{ \"gameId\": \"...\" }`; a patch job adds `verified` (boolean, `false` for IPS); a pak installation (a `pak-install` job, M12) gives `{ \"pakId\": \"...\" }`; an `archive-import` job (M19) gives `gameId`, `imported`, `skipped`, `trashEntryId` and `saveBackupId`."
          additionalProperties: true
        error:
          description: Same object as in error responses, when `failed`.
          oneOf:
            - $ref: '#/components/schemas/ErrorBody'
            - type: 'null'
        cancelRequested:
          type: boolean
          description: |
            `true` once `DELETE /jobs/{jobId}` was received while the job was
            running (added in M6). The job stays `running` until it really
            ends: `cancelled` (nothing installed) or `succeeded` (cancelled
            too late, while installing). Kept in the final state.
    JobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items: { $ref: '#/components/schemas/Job' }
    EventPaks:
      type: object
      description: 'M12: the installed paks changed; reload `GET /paks`.'
      additionalProperties: true
    PakKind:
      type: string
      enum: [tool, emu]
      description: '`tool`: `Tools/<platform>/`; `emu`: `Emus/<platform>/`.'
    PakInstallKind:
      type: string
      enum: [tool, emu, auto]
      default: auto
      description: Where to install the pak; `auto` deduces it (see `POST /paks/install`).
    Pak:
      type: object
      required: [pakId, name, kind, path, sizeBytes, modifiedAt, version, self]
      properties:
        pakId: { $ref: '#/components/schemas/OpaqueId' }
        name: { type: string, description: 'Folder name without `.pak`.' }
        kind: { $ref: '#/components/schemas/PakKind' }
        path: { type: string, description: 'Informative, relative to the SD card root. Never sent back.' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        modifiedAt: { $ref: '#/components/schemas/Timestamp' }
        version:
          type: [string, 'null']
          description: '`version` of its `pak.json`, null when absent or unreadable.'
        self: { type: boolean, description: The pak of ReminisLink itself (can be neither deleted nor replaced). }
    PakList:
      type: object
      required: [paks]
      properties:
        paks:
          type: array
          items: { $ref: '#/components/schemas/Pak' }
    PakInstallRequest:
      type: object
      required: [sdEntryId]
      properties:
        sdEntryId:
          $ref: '#/components/schemas/OpaqueId'
          description: A zip file or a `.pak` folder listed by `GET /sd/browse`.
        kind: { $ref: '#/components/schemas/PakInstallKind' }
        onConflict:
          type: string
          enum: [fail, replace]
          default: fail
          description: 'When a pak of the same name exists: `fail` (the job fails with `409 conflict`) or `replace` (the old pak goes to the trash). The app sends `replace` after the user confirmed.'
    SdEntry:
      type: object
      required: [sdEntryId, name, kind, sizeBytes, modifiedAt]
      properties:
        sdEntryId: { $ref: '#/components/schemas/OpaqueId' }
        name: { type: string }
        kind: { type: string, enum: [folder, file] }
        sizeBytes:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: Null for a folder.
        modifiedAt: { $ref: '#/components/schemas/Timestamp' }
    SdFolder:
      type: object
      required: [folderId, path, parentId, entries, truncated]
      properties:
        folderId:
          type: [string, 'null']
          description: '`sdEntryId` of this folder, null for the root of the SD card.'
        path: { type: string, description: 'Informative, relative to the SD card root ("" for the root). Never sent back.' }
        parentId:
          type: [string, 'null']
          description: 'The `folderId` that opens the parent folder: null when the parent is the root (or for the root itself, which has no parent).'
        entries:
          type: array
          items: { $ref: '#/components/schemas/SdEntry' }
        truncated: { type: boolean, description: More than 5000 entries; only the first 5000 (in the sort order) are listed. }
