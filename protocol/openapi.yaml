openapi: 3.1.0
info:
  title: ReminisLink API
  version: 1.0.0
  summary: HTTP API served by the ReminisLink pak on the handheld, used by the iOS app.
  description: |
    Source of truth for both implementations (Go pak and Swift app). It is
    derived from `docs/specs/03-protocole.md` and `docs/specs/04-api-v1.md`;
    any API change is made here first.

    ## Transport
    HTTP/1.1 on the local network, no TLS in v1. Default port 47821 (the pak
    tries the 9 next ports if it is busy; the real port is announced with
    Bonjour `_reminislink._tcp` and in the pairing QR code). All paths below
    are relative to the `/api/v1` prefix. JSON bodies are UTF-8,
    `camelCase`, at most 1 MiB. Dates are RFC 3339 UTC, sizes are 64-bit
    byte counts. Clients must ignore unknown fields.

    ## Identifiers
    `systemId`, `gameId` and `folderId` are base64url (no padding) of a path
    relative to `Roms/`; `sdFileId`, `stagingId`, `backupId`, `entryId`,
    `trashEntryId`, `uploadId` and `jobId` are generated by the pak. All are
    **opaque**: the app never builds nor decodes them, it sends them back as
    received. An unreadable identifier, or one that resolves outside its root,
    is answered with `400 invalid_id`. `path` fields in responses are
    informative only and are never sent back.

    ## Request signing
    Every route except `GET /hello` and `POST /pair` is signed with the key
    shared at pairing. The five `X-RL-*` headers (see the security schemes)
    carry the signature of this canonical string (lines joined with `\n`, no
    trailing newline):

    ```
    RL1-HMAC-SHA256
    <METHOD in uppercase>
    <path as sent on the request line, still percent-encoded, with /api/v1, without the query>
    <canonical query>
    <X-RL-Time>
    <X-RL-Nonce>
    <X-RL-Content-SHA256>
    ```

    Canonical query: the raw query is split on `&`, each pair at its first
    `=`, decoded (`+` is a space, `%XX` a byte), re-encoded per RFC 3986
    (only `A-Z a-z 0-9 - . _ ~` stay as is, `%XX` in uppercase), sorted by
    encoded key then encoded value (byte order) and joined as `key=value`
    with `&`. Empty when there is no parameter. Clients send queries already
    in this encoding (a literal `+` is `%2B`, a space `%20`).

    The pak checks, in this order: unknown client (`401 unknown_client`);
    malformed signature headers (`401 bad_signature`); clock skew above 300 s
    (`401 clock_skew`, the app corrects with `serverTime` from `/hello` and
    retries once); nonce already used in the last 10 minutes
    (`401 replayed_request`); HMAC compared in constant time, then body
    SHA-256 (both `401 bad_signature`; the body of a request whose signature
    is wrong is never read). A signed body is limited to 1 MiB (64 MiB for
    `PUT /games/{gameId}/save`), otherwise `413 too_large`. If the device
    cannot remember more nonces, it answers `429 too_many_attempts`.

    Shared test vectors: `protocol/test-vectors/`.

    ## Errors
    Every error has the body `{ "error": { "code", "message", "details" } }`.
    `message` is English, for logs; the app shows a translated text chosen
    from `code`.
servers:
  - url: http://{host}:{port}/api/v1
    description: ReminisLink pak on the local network
    variables:
      host:
        default: 192.168.1.42
        description: IPv4 address resolved with Bonjour (or from the QR code during pairing)
      port:
        default: '47821'
        description: Port announced with Bonjour
security:
  - rlClient: []
    rlTime: []
    rlNonce: []
    rlContentSha256: []
    rlSignature: []
tags:
  - name: Device
    description: Handshake, pairing and device state.
  - name: Library
    description: Systems, folders and games.
  - name: Trash
    description: Files moved away by destructive operations, kept 30 days.
  - name: Saves
    description: In-game saves and their backup copies.
  - name: States
    description: Emulator save states, locks and resume history.
  - name: Cheats
    description: RetroArch `.cht` cheat lists.
  - name: Transfers
    description: Resumable uploads, device-side downloads and patching.
  - name: Jobs
    description: Long-running device-side operations.

paths:
  /hello:
    get:
      tags: [Device]
      operationId: getHello
      summary: Introduce the device (unsigned)
      description: |
        Checks that the app talks to the expected device, measures the clock
        skew and checks compatibility. Rate-limited to 10 requests per second
        per IP. Returns nothing else (no games, no clients).
      security: []
      responses:
        '200':
          description: Device introduction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hello' }
              example:
                deviceId: 7f3a9c2e-1b4d-4c55-9a51-2f0f9e7d3a10
                deviceName: Brick de Thomas
                model: brick
                platform: tg5040
                os: nextui
                osVersion: 6.14.0
                pakVersion: 1.0.0
                apiVersion: 1
                minClientVersion: 1.0.0
                serverTime: '2026-11-18T17:00:00Z'
                pairingOpen: true
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /pair:
    post:
      tags: [Device]
      operationId: pair
      summary: Pair the app with the device (unsigned)
      description: |
        Mutual authentication and key derivation (03-protocole §3.2).
        `ikm` is the 32-byte QR secret (`qr`) or the UTF-8 bytes of the PIN
        (`pin`).

        - client `proof` = b64u(HMAC-SHA256(ikm, `RL1-PAIR-CLIENT|` + deviceId + `|` + clientId + `|` + clientNonce))
          where clientNonce is the b64u string as sent;
        - key = HKDF-SHA256(ikm, salt = clientNonce ‖ deviceNonce (raw bytes),
          info = `RL1-KEY|` + deviceId + `|` + clientId, L = 32);
        - device `proof` = b64u(HMAC-SHA256(key, `RL1-PAIR-DEVICE|` + deviceId + `|` + clientId)).

        The key never travels. A wrong proof or an expired secret gives
        `401 pairing_failed`; after 5 failures the secret and the PIN are
        regenerated and pairing is blocked for 30 s (`429 too_many_attempts`).
        The secret is single use. Pairing again with the same `clientId`
        replaces its key. Rate-limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairRequest' }
            example:
              method: qr
              clientId: 3b1c8d2a-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              clientName: iPhone de Thomas
              clientNonce: 1VJAnjLsGJmboJkSh9gQhE6Ek3vGUjOyCpczkoh2ZUk
              proof: SdvbDjoHNSgSAY-08qUbzoh8RoJ-66Pel4qbFNb7EYI
      responses:
        '200':
          description: Paired. The app derives the key and checks `proof` before storing it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairResponse' }
              example:
                deviceId: 7f3a9c2e-1b4d-4c55-9a51-2f0f9e7d3a10
                deviceName: Brick de Thomas
                deviceNonce: dt1WaitBI6WbQWuwqh2X_tUrbbTlvbKCuj3fWQMncvM
                proof: UfZxa5dfLLL0YLDfFwjEUiac8DVldpr7LGjQEDNEip4
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/PairingFailed' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /clients/me:
    delete:
      tags: [Device]
      operationId: unpair
      summary: Unpair the calling client
      description: Removes the calling client from the device. The app then deletes the key from its Keychain.
      responses:
        '204': { description: Unpaired. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /device:
    get:
      tags: [Device]
      operationId: getDevice
      summary: Device state
      responses:
        '200':
          description: Device state. `ssid`, `battery` and `osVersion` may be null when unknown.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
              example:
                deviceId: 7f3a9c2e-1b4d-4c55-9a51-2f0f9e7d3a10
                deviceName: Brick de Thomas
                model: brick
                platform: tg5040
                os: nextui
                osVersion: 6.14.0
                pakVersion: 1.0.0
                network: { ipv4: 192.168.1.42, ssid: MaBox }
                battery: { percent: 78, charging: false }
                storage:
                  - { id: sd, label: SD, totalBytes: 127865454592, freeBytes: 40265318400 }
                uptimeSeconds: 512
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /systems:
    get:
      tags: [Library]
      operationId: listSystems
      summary: List the systems
      description: |
        Folders of `Roms/` with a `(TAG)` suffix and at least one visible item.
        The leading sort number (`01) `, `02_`...) is removed from `label`.
        Sorted alphabetically, case-insensitive.
      responses:
        '200':
          description: Systems.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemList' }
              example:
                systems:
                  - id: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKQ
                    label: Game Boy Advance
                    folder: Game Boy Advance (GBA)
                    tag: GBA
                    gameCount: 42
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /systems/{systemId}/games:
    get:
      tags: [Library]
      operationId: listSystemGames
      summary: List a folder of a system
      description: |
        Without `folderId`, the root of the system. Ignored files are those of
        Cheat Manager (`.txt`, `.png`, `.sav`, `.cht`, `.bak`...) and hidden
        files.
      parameters:
        - $ref: '#/components/parameters/SystemId'
        - name: folderId
          in: query
          required: false
          description: Folder identifier returned by a previous call, to list a subfolder.
          schema: { $ref: '#/components/schemas/OpaqueId' }
          example: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9IYWNrcw
      responses:
        '200':
          description: Folders and games of the folder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameListing' }
              example:
                folders:
                  - { id: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9IYWNrcw, name: Hacks, gameCount: 3 }
                games:
                  - id: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Qb2tlbW9uIEVtZXJhbGQuZ2Jh
                    name: Pokemon Emerald
                    fileName: Pokemon Emerald.gba
                    kind: file
                    sizeBytes: 16777216
                    modifiedAt: '2026-10-02T09:12:00Z'
                    hasSave: true
                    stateCount: 3
                    lockedStateCount: 1
                    cheatCount: 12
                    hasArt: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}:
    get:
      tags: [Library]
      operationId: getGame
      summary: Game detail and its files
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: The game and every file that belongs to it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetail' }
              example:
                id: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Qb2tlbW9uIEVtZXJhbGQuZ2Jh
                systemId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKQ
                name: Pokemon Emerald
                fileName: Pokemon Emerald.gba
                kind: file
                files:
                  - { role: rom, path: Roms/Game Boy Advance (GBA)/Pokemon Emerald.gba, sizeBytes: 16777216, modifiedAt: '2026-10-02T09:12:00Z' }
                  - { role: save, path: Saves/GBA/Pokemon Emerald.gba.sav, sizeBytes: 131072, modifiedAt: '2026-11-18T16:55:00Z' }
                  - { role: state, slot: 0, path: .userdata/shared/.minui/GBA/Pokemon Emerald.gba.st0, sizeBytes: 401408, modifiedAt: '2026-11-18T16:55:00Z' }
                  - { role: cheats, path: Cheats/GBA/Pokemon Emerald.gba.cht, sizeBytes: 2048, modifiedAt: '2026-10-02T09:12:00Z' }
                  - { role: art, path: Roms/Game Boy Advance (GBA)/.media/Pokemon Emerald.png, sizeBytes: 50211, modifiedAt: '2026-10-02T09:12:00Z' }
                totalBytes: 17377096
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    delete:
      tags: [Library]
      operationId: deleteGame
      summary: Delete a game and its data (to the trash)
      description: |
        Moves to the ReminisLink trash (a rename on the same SD card, nothing
        is erased): the ROM (or the `.m3u` and its folder), the save, the
        states, the cheats and the art. The locks and the resume history of
        the game are deleted. With `keepSave=true`, the save and the states
        stay in place. Space is only freed when the trash is purged
        (automatically after 30 days, or with `DELETE /trash`).
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: keepSave
          in: query
          required: false
          description: Keep the save and the states in place.
          schema: { type: boolean, default: false }
          example: false
      responses:
        '200':
          description: Moved to the trash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashMoveResult' }
              example:
                trashEntryId: tr_20261118T170000Z_a1b2
                moved:
                  - Roms/Game Boy Advance (GBA)/Pokemon Emerald.gba
                  - Saves/GBA/Pokemon Emerald.gba.sav
                  - Cheats/GBA/Pokemon Emerald.gba.cht
                movedBytes: 17377096
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/art:
    get:
      tags: [Library]
      operationId: getGameArt
      summary: Game art (PNG)
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: If-None-Match
          in: header
          required: false
          description: ETag of the cached art.
          schema: { type: string }
          example: '"sha256-3f2a"'
      responses:
        '200':
          description: The art.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              description: Always `private, max-age=86400`.
              schema: { type: string, const: 'private, max-age=86400' }
          content:
            image/png:
              schema: { type: string, contentMediaType: image/png }
              example: '<PNG image bytes>'
        '304':
          description: The cached art is still valid.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /trash:
    get:
      tags: [Trash]
      operationId: listTrash
      summary: Trash content and size
      description: |
        One entry groups everything a single operation moved to the trash.
        Entries expire after 30 days (purged when the pak starts). Restoring
        from the trash is not part of v1.
      responses:
        '200':
          description: Trash entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashList' }
              example:
                entries:
                  - id: tr_20261118T170000Z_a1b2
                    trashedAt: '2026-11-18T17:00:00Z'
                    reason: delete-game
                    label: Pokemon Emerald
                    files:
                      - Roms/Game Boy Advance (GBA)/Pokemon Emerald.gba
                      - Saves/GBA/Pokemon Emerald.gba.sav
                    sizeBytes: 17377096
                    expiresAt: '2026-12-18T17:00:00Z'
                totalBytes: 17377096
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    delete:
      tags: [Trash]
      operationId: emptyTrash
      summary: Empty the trash (permanent)
      description: |
        Permanent deletion: with `DELETE /trash/{entryId}`, the only routes
        that really erase user data. Requires `X-RL-Confirm: empty-trash` on
        top of the signature, otherwise `400 invalid_request`.
      parameters:
        - $ref: '#/components/parameters/ConfirmEmptyTrash'
      responses:
        '200':
          description: Trash emptied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreedBytes' }
              example: { freedBytes: 17377096 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /trash/{entryId}:
    delete:
      tags: [Trash]
      operationId: deleteTrashEntry
      summary: Permanently delete a trash entry
      description: "Same rules as `DELETE /trash`, for one entry. Requires `X-RL-Confirm: empty-trash`."
      parameters:
        - name: entryId
          in: path
          required: true
          description: Trash entry identifier.
          schema: { $ref: '#/components/schemas/OpaqueId' }
          example: tr_20261118T170000Z_a1b2
        - $ref: '#/components/parameters/ConfirmEmptyTrash'
      responses:
        '200':
          description: Entry deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreedBytes' }
              example: { freedBytes: 17377096 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/save:
    get:
      tags: [Saves]
      operationId: downloadSave
      summary: Download the save
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: The save file.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
          content:
            application/octet-stream:
              schema: { $ref: '#/components/schemas/Binary' }
              example: '<binary file content>'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    put:
      tags: [Saves]
      operationId: replaceSave
      summary: Replace the save
      description: |
        Body: the new save, at most 64 MiB (larger files go through
        `POST /uploads` with `target.kind = "save"`). The previous save is
        first copied as a backup (`before-replace`, label `Avant remplacement`).
        The body is signed like any other (`X-RL-Content-SHA256` is its hash).
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { $ref: '#/components/schemas/Binary' }
            example: '<binary file content>'
      responses:
        '200':
          description: Save replaced. `backup` is the copy of the previous save (null if there was none).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupResult' }
              example:
                backup: { id: bk_20261118T170000Z_c3d4, label: Avant remplacement, createdAt: '2026-11-18T17:00:00Z', sizeBytes: 131072, reason: before-replace }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /games/{gameId}/save/backups:
    get:
      tags: [Saves]
      operationId: listSaveBackups
      summary: List the save backups
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Backups, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupList' }
              example:
                backups:
                  - { id: bk_20261118T170000Z_a1b2, label: Avant le boss final, createdAt: '2026-11-18T17:00:00Z', sizeBytes: 131072, reason: manual }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    post:
      tags: [Saves]
      operationId: createSaveBackup
      summary: Back up the current save ("duplicate the save")
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBackupRequest' }
            example: { label: Avant le boss final }
      responses:
        '201':
          description: Backup created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Backup' }
              example: { id: bk_20261118T170000Z_a1b2, label: Avant le boss final, createdAt: '2026-11-18T17:00:00Z', sizeBytes: 131072, reason: manual }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /games/{gameId}/save/backups/{backupId}:
    get:
      tags: [Saves]
      operationId: downloadSaveBackup
      summary: Download a save backup
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/BackupId'
      responses:
        '200':
          description: The backup file.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
          content:
            application/octet-stream:
              schema: { $ref: '#/components/schemas/Binary' }
              example: '<binary file content>'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    delete:
      tags: [Saves]
      operationId: deleteSaveBackup
      summary: Delete a save backup
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/BackupId'
      responses:
        '204': { description: Backup deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/save/backups/{backupId}/restore:
    post:
      tags: [Saves]
      operationId: restoreSaveBackup
      summary: Restore a save backup
      description: |
        Copies the current save first (`before-restore`), then replaces the
        save with the chosen backup. The response carries that safety copy
        (null if there was no current save).
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/BackupId'
      responses:
        '200':
          description: Save restored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupResult' }
              example:
                backup: { id: bk_20261118T171000Z_e5f6, label: null, createdAt: '2026-11-18T17:10:00Z', sizeBytes: 131072, reason: before-restore }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /games/{gameId}/states:
    get:
      tags: [States]
      operationId: listStates
      summary: State slots of a game
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Occupied slots (and slots with only a locked copy).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlotList' }
              example:
                slots:
                  - { slot: 0, sizeBytes: 401408, modifiedAt: '2026-11-18T16:55:00Z', hasThumbnail: true, locked: true, lockStatus: intact }
                  - { slot: 1, sizeBytes: 401408, modifiedAt: '2026-11-17T20:12:00Z', hasThumbnail: false, locked: false, lockStatus: null }
                resumeSlot: 9
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/states/{slot}:
    get:
      tags: [States]
      operationId: downloadState
      summary: Download a state
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Slot'
      responses:
        '200':
          description: The state file.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
          content:
            application/octet-stream:
              schema: { $ref: '#/components/schemas/Binary' }
              example: '<binary file content>'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    delete:
      tags: [States]
      operationId: deleteState
      summary: Delete a state (to the trash)
      description: The state is moved to the trash. A locked slot gives `409 state_locked`.
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Slot'
      responses:
        '200':
          description: Moved to the trash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashMoveResult' }
              example:
                trashEntryId: tr_20261118T171500Z_0c1d
                moved: [.userdata/shared/.minui/GBA/Pokemon Emerald.gba.st1]
                movedBytes: 401408
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/states/{slot}/thumbnail:
    get:
      tags: [States]
      operationId: getStateThumbnail
      summary: State thumbnail (PNG)
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Slot'
      responses:
        '200':
          description: The thumbnail, if NextUI saved one with the state.
          content:
            image/png:
              schema: { type: string, contentMediaType: image/png }
              example: '<PNG image bytes>'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/states/{slot}/lock:
    put:
      tags: [States]
      operationId: lockState
      summary: Lock a state
      description: Copies the state to the lock area and records its SHA-256.
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Slot'
      responses:
        '200':
          description: The updated slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
              example: { slot: 0, sizeBytes: 401408, modifiedAt: '2026-11-18T16:55:00Z', hasThumbnail: true, locked: true, lockStatus: intact }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
    delete:
      tags: [States]
      operationId: unlockState
      summary: Unlock a state
      description: Removes the lock and deletes the locked copy. The state itself does not change.
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Slot'
      responses:
        '200':
          description: The updated slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
              example: { slot: 0, sizeBytes: 401408, modifiedAt: '2026-11-18T16:55:00Z', hasThumbnail: true, locked: false, lockStatus: null }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/states/{slot}/restore:
    post:
      tags: [States]
      operationId: restoreLockedState
      summary: Restore the locked copy of a state
      description: Replaces the state with its locked copy; the current state is moved to the trash first.
      parameters:
        - $ref: '#/components/parameters/GameId'
        - $ref: '#/components/parameters/Slot'
      responses:
        '200':
          description: The updated slot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Slot' }
              example: { slot: 0, sizeBytes: 401408, modifiedAt: '2026-11-18T17:20:00Z', hasThumbnail: true, locked: true, lockStatus: intact }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /games/{gameId}/resume-history:
    get:
      tags: [States]
      operationId: listResumeHistory
      summary: History of the resume state
      description: The last 5 distinct versions of the resume state, archived by the pak at each start.
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: History entries, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeHistory' }
              example:
                entries:
                  - { id: rh_20261118T165500Z, capturedAt: '2026-11-18T16:55:00Z', sizeBytes: 401408 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/resume-history/{entryId}/restore:
    post:
      tags: [States]
      operationId: restoreResumeHistoryEntry
      summary: Restore a version of the resume state
      description: Replaces the resume state with this version; the current version is archived first. Returns the updated history.
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: entryId
          in: path
          required: true
          description: Resume history entry identifier.
          schema: { $ref: '#/components/schemas/OpaqueId' }
          example: rh_20261118T165500Z
      responses:
        '200':
          description: The updated history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumeHistory' }
              example:
                entries:
                  - { id: rh_20261118T172500Z, capturedAt: '2026-11-18T17:25:00Z', sizeBytes: 401408 }
                  - { id: rh_20261118T165500Z, capturedAt: '2026-11-18T16:55:00Z', sizeBytes: 401408 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /games/{gameId}/cheats:
    get:
      tags: [Cheats]
      operationId: getCheats
      summary: Read the cheat list
      description: RetroArch `.cht` format, managed like Cheat Manager (unknown keys kept in `extra`).
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Cheats and the ETag of the file.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheatList' }
              example:
                cheats:
                  - { index: 0, description: Infinite money, code: 82025490+FFFF, enabled: false, extra: { cheat0_handler: '0' } }
                etag: '"sha256-9b1f"'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    put:
      tags: [Cheats]
      operationId: replaceCheats
      summary: Replace the cheat list
      description: |
        The complete list, in order. The previous file is kept as `.cht.bak`.
        If the file changed since `If-Match`: `412` with code `conflict`. An
        empty list deletes the `.cht` file (keeping the `.bak`).
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: If-Match
          in: header
          required: true
          description: '`etag` returned by `GET /games/{gameId}/cheats`.'
          schema: { type: string }
          example: '"sha256-9b1f"'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheatsUpdate' }
            example:
              cheats:
                - { index: 0, description: Infinite money, code: 82025490+FFFF, enabled: true, extra: { cheat0_handler: '0' } }
      responses:
        '200':
          description: The new list and ETag.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheatList' }
              example:
                cheats:
                  - { index: 0, description: Infinite money, code: 82025490+FFFF, enabled: true, extra: { cheat0_handler: '0' } }
                etag: '"sha256-77ac"'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/cheats/import:
    post:
      tags: [Cheats]
      operationId: importCheats
      summary: Import cheats
      description: |
        Sources: `url` (downloaded by the device, 5 MiB max, synchronous),
        `sd` (`sdFileId` from `GET /sd/files`), `inline` (`.cht` text, 1 MiB
        max), `upload` (`uploadId` of a completed upload with
        `target.kind = "staging"`). `422 unsupported_format` if no cheat is
        found.
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheatImportRequest' }
            example:
              source: { type: url, url: 'https://example.org/cheats/game.cht' }
              mode: merge
      responses:
        '200':
          description: Imported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheatImportResult' }
              example: { imported: 15, total: 27 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /sd/files:
    get:
      tags: [Cheats]
      operationId: listSdFiles
      summary: List the cheat and patch files on the SD card
      description: |
        `type=cht`: `.cht` files under `Cheats/`. `type=patch`: `.ips`, `.bps`,
        `.ups` files under `Roms/` and under `ReminisLink/patches/`.
      parameters:
        - name: type
          in: query
          required: true
          description: Kind of files to list.
          schema: { type: string, enum: [cht, patch] }
          example: cht
      responses:
        '200':
          description: Usable files.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SdFileList' }
              example:
                files:
                  - { id: sd_Q2hlYXRzL0dCQS9Qb2tlbW9uIEVtZXJhbGQuZ2JhLmNodA, path: Cheats/GBA/Pokemon Emerald.gba.cht, sizeBytes: 2048 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /uploads:
    post:
      tags: [Transfers]
      operationId: createUpload
      summary: Create a resumable upload
      description: |
        The device checks free space (size + 5 %), reserves a temporary file
        on the SD card and returns `uploadId` and `chunkSize` (default 4 MiB,
        at most 16 MiB). The announced `sha256` protects the unsigned chunks.
        `onConflict`: `fail` (`409 conflict`), `rename` (adds ` (2)`,
        ` (3)`...), `overwrite` (the old file goes to the trash). Uploads idle
        for 24 h are deleted; uploads are lost when the pak closes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUploadRequest' }
            example:
              target: { kind: rom, systemId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKQ, folderId: null, fileName: Pokemon Unbound.gba }
              sizeBytes: 33554432
              sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
              onConflict: fail
      responses:
        '201':
          description: Upload created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadCreated' }
              example: { uploadId: up_01JD3X5V7Q9W, chunkSize: 4194304, offset: 0, expiresAt: '2026-11-19T17:00:00Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /uploads/{uploadId}:
    get:
      tags: [Transfers]
      operationId: getUpload
      summary: Upload state (to resume)
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: Bytes received so far.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadStatus' }
              example: { uploadId: up_01JD3X5V7Q9W, offset: 12582912, sizeBytes: 33554432 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    put:
      tags: [Transfers]
      operationId: uploadChunk
      summary: Send a chunk
      description: |
        The only route where `X-RL-Content-SHA256` is `UNSIGNED` (the body
        is not hashed in the signature; the whole file is checked against
        the `sha256` announced at creation). `Upload-Offset` must equal the
        current offset, otherwise `409 conflict` with `details.offset`.
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - name: Upload-Offset
          in: header
          required: true
          description: Offset of this chunk in the file.
          schema: { type: integer, format: int64, minimum: 0 }
          example: 12582912
        - name: Content-Length
          in: header
          required: true
          description: Chunk size (at most `chunkSize`).
          schema: { type: integer, format: int64, minimum: 1, maximum: 16777216 }
          example: 4194304
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { $ref: '#/components/schemas/Binary' }
            example: '<binary file content>'
      responses:
        '204':
          description: Chunk stored.
          headers:
            Upload-Offset:
              description: New offset.
              schema: { type: integer, format: int64, minimum: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
    delete:
      tags: [Transfers]
      operationId: cancelUpload
      summary: Cancel an upload
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204': { description: Upload cancelled and its temporary file deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /uploads/{uploadId}/complete:
    post:
      tags: [Transfers]
      operationId: completeUpload
      summary: Finish an upload
      description: |
        The device compares the SHA-256 (computed while receiving); on a
        mismatch, `409 checksum_mismatch` and the upload is deleted.
        Otherwise `fsync`, conflict rule, rename to the destination. The
        response depends on the target: `rom` → `gameId`, `save` → `backup`
        (copy of the previous save), `state` → `slot`, `staging` →
        `stagingId`.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: The created resource.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResult' }
              example: { gameId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9IYWNrcy9Qb2tlbW9uIFVuYm91bmQuZ2Jh }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }

  /downloads:
    post:
      tags: [Transfers]
      operationId: createDownload
      summary: Download a URL on the device (creates a job)
      description: |
        Same `target` as `POST /uploads`; `fileName` may be omitted (taken
        from `Content-Disposition` or the URL). `http` and `https` only, 5
        redirects, 4 GiB max. The result of the job is the created resource.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DownloadRequest' }
            example:
              url: 'https://example.org/hack.bps'
              target: { kind: staging }
              sha256: null
              onConflict: rename
      responses:
        '202':
          description: Job created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
              example: { jobId: job_01JD3Y0A2B3C }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/patch:
    post:
      tags: [Transfers]
      operationId: patchGame
      summary: Apply a patch (creates a job)
      description: |
        Formats: IPS (with the EOF truncation extension), BPS (source, target
        and patch CRC32 checked), UPS (CRC32 checked). `output.mode`:
        `new-file` (default, a new ROM next to the original) or `replace`
        (the original goes to the trash). The job result holds the `gameId`
        of the produced ROM; a failed job carries `422 unsupported_format` or
        `422 patch_mismatch` in its `error`.
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchRequest' }
            example:
              patch: { type: staging, stagingId: st_01JD3Y4K5M6N }
              output: { mode: new-file, fileName: Pokemon Emerald (FR).gba }
      responses:
        '202':
          description: Job created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobAccepted' }
              example: { jobId: job_01JD3Y7P8Q9R }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: Recent jobs
      description: Queued, running and recently finished jobs (finished jobs are kept 1 hour in memory).
      responses:
        '200':
          description: Jobs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobList' }
              example:
                jobs:
                  - id: job_01JD3Y0A2B3C
                    kind: download
                    state: running
                    progress: { done: 12582912, total: 536870912 }
                    createdAt: '2026-11-18T17:00:00Z'
                    updatedAt: '2026-11-18T17:00:12Z'
                    result: null
                    error: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Job state
      description: The app polls it every second while the screen is visible.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              example:
                id: job_01JD3Y7P8Q9R
                kind: patch
                state: succeeded
                progress: { done: 16777216, total: 16777216 }
                createdAt: '2026-11-18T17:00:00Z'
                updatedAt: '2026-11-18T17:00:04Z'
                result: { gameId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Qb2tlbW9uIEVtZXJhbGQgKEZSKS5nYmE }
                error: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    delete:
      tags: [Jobs]
      operationId: cancelJob
      summary: Cancel a job
      description: Cancels a queued or running job (its partial file is deleted). Returns the job in its new state.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The cancelled job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
              example:
                id: job_01JD3Y0A2B3C
                kind: download
                state: cancelled
                progress: { done: 12582912, total: null }
                createdAt: '2026-11-18T17:00:00Z'
                updatedAt: '2026-11-18T17:00:20Z'
                result: null
                error: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

components:
  securitySchemes:
    rlClient:
      type: apiKey
      in: header
      name: X-RL-Client
      description: '`clientId` of the paired app (lowercase UUID). Part of the RL1-HMAC-SHA256 signature, see the API description.'
    rlTime:
      type: apiKey
      in: header
      name: X-RL-Time
      description: Unix time in seconds, decimal without sign nor leading zero. Must be within 300 s of the device clock.
    rlNonce:
      type: apiKey
      in: header
      name: X-RL-Nonce
      description: 16 random bytes in base64url without padding, unique per request (remembered 10 minutes).
    rlContentSha256:
      type: apiKey
      in: header
      name: X-RL-Content-SHA256
      description: Lowercase hex SHA-256 of the body (SHA-256 of the empty string for no body); `UNSIGNED` only on `PUT /uploads/{uploadId}`.
    rlSignature:
      type: apiKey
      in: header
      name: X-RL-Signature
      description: base64url (no padding) of HMAC-SHA256(key, canonical string).

  parameters:
    SystemId:
      name: systemId
      in: path
      required: true
      description: System identifier (opaque).
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKQ
    GameId:
      name: gameId
      in: path
      required: true
      description: Game identifier (opaque).
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Qb2tlbW9uIEVtZXJhbGQuZ2Jh
    BackupId:
      name: backupId
      in: path
      required: true
      description: Save backup identifier.
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: bk_20261118T170000Z_a1b2
    Slot:
      name: slot
      in: path
      required: true
      description: State slot number.
      schema: { type: integer, minimum: 0 }
      example: 0
    UploadId:
      name: uploadId
      in: path
      required: true
      description: Upload identifier.
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: up_01JD3X5V7Q9W
    JobId:
      name: jobId
      in: path
      required: true
      description: Job identifier.
      schema: { $ref: '#/components/schemas/OpaqueId' }
      example: job_01JD3Y0A2B3C
    ConfirmEmptyTrash:
      name: X-RL-Confirm
      in: header
      required: true
      description: Explicit confirmation of a permanent deletion. Without it, `400 invalid_request`.
      schema: { type: string, const: empty-trash }
      example: empty-trash

  headers:
    ETag:
      description: Entity tag of the resource.
      schema: { type: string }
    ContentDisposition:
      description: '`attachment; filename="<name>"`.'
      schema: { type: string }

  responses:
    BadRequest:
      description: '`invalid_request` (bad JSON, missing field, missing confirmation), `invalid_id` or `invalid_name`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: invalid_id, message: Invalid identifier, details: {} } }
    Unauthorized:
      description: Authentication failed (`unknown_client`, `bad_signature`, `clock_skew`, `replayed_request`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: clock_skew, message: Request time is too far from the device time, details: {} } }
    PairingFailed:
      description: Wrong proof or expired secret (`pairing_failed`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: pairing_failed, message: Pairing failed, details: {} } }
    NotFound:
      description: Resource not found (`not_found`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: not_found, message: Game not found, details: {} } }
    Conflict:
      description: |
        `conflict` (target exists: `details.existing`; wrong upload offset:
        `details.offset`), `checksum_mismatch` or `state_locked`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: conflict, message: Unexpected upload offset, details: { offset: 12582912 } } }
    PreconditionFailed:
      description: The resource changed since the given ETag (code `conflict`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: conflict, message: Cheat file changed, details: {} } }
    TooLarge:
      description: Body or file too large (`too_large`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: too_large, message: Body too large, details: {} } }
    Unprocessable:
      description: '`unsupported_format` or `patch_mismatch`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: unsupported_format, message: No cheat found, details: {} } }
    TooManyAttempts:
      description: Pairing blocked or rate limit reached (`too_many_attempts`).
      headers:
        Retry-After:
          description: Seconds before trying again.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: too_many_attempts, message: Pairing is blocked, details: {} } }
    TooManyRequests:
      description: |
        The device cannot take more signed requests right now
        (`too_many_attempts`): its cache of recent request nonces is full
        and it never forgets a live nonce to make room. Retry later.
      headers:
        Retry-After:
          description: Seconds before trying again.
          schema: { type: integer, minimum: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: too_many_attempts, message: Too many requests, details: {} } }
    Internal:
      description: Unexpected error (`internal`); details are in the device log.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: internal, message: Internal error, details: {} } }
    ShuttingDown:
      description: The pak is closing (`shutting_down`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: shutting_down, message: Shutting down, details: {} } }
    InsufficientStorage:
      description: Not enough free space (`insufficient_storage`, `details.required`, `details.available`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: { code: insufficient_storage, message: Not enough free space, details: { required: 35232153, available: 1048576 } } }

  schemas:
    OpaqueId:
      type: string
      description: Opaque identifier, sent back exactly as received.
      minLength: 1
      pattern: '^[A-Za-z0-9_-]+$'
    Uuid:
      type: string
      description: Lowercase hyphenated UUID.
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
    B64U32:
      type: string
      description: 32 bytes in base64url without padding.
      pattern: '^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$'
    Sha256Hex:
      type: string
      description: Lowercase hex SHA-256.
      pattern: '^[0-9a-f]{64}$'
    Bytes:
      type: integer
      format: int64
      minimum: 0
      description: Size in bytes.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC.
    Binary:
      type: string
      contentMediaType: application/octet-stream
    FileName:
      type: string
      description: File name without directory; cleaned by the device (`invalid_name` if refused). At most 255 bytes.
      minLength: 1
    Model:
      type: string
      enum: [brick, brickpro, smartpro, smartpros, h700, my355, desktop]

    ErrorCode:
      type: string
      enum:
        - invalid_request
        - invalid_id
        - invalid_name
        - unknown_client
        - bad_signature
        - clock_skew
        - replayed_request
        - pairing_failed
        - not_found
        - conflict
        - checksum_mismatch
        - state_locked
        - too_large
        - unsupported_format
        - patch_mismatch
        - too_many_attempts
        - internal
        - shutting_down
        - insufficient_storage
    ErrorBody:
      type: object
      required: [code, message, details]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string, description: 'English, for logs.' }
        details:
          type: object
          description: Extra data depending on `code` (`existing`, `offset`, `required`, `available`...).
          additionalProperties: true
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }

    Hello:
      type: object
      required: [deviceId, deviceName, model, platform, os, osVersion, pakVersion, apiVersion, minClientVersion, serverTime, pairingOpen]
      properties:
        deviceId: { $ref: '#/components/schemas/Uuid' }
        deviceName: { type: string }
        model: { $ref: '#/components/schemas/Model' }
        platform: { type: string, description: 'NextUI platform, e.g. `tg5040`.' }
        os: { type: string, description: 'For example `nextui`.' }
        osVersion: { type: [string, 'null'] }
        pakVersion: { type: string }
        apiVersion: { type: integer, minimum: 1 }
        minClientVersion: { type: string, description: Oldest app version supported. }
        serverTime: { $ref: '#/components/schemas/Timestamp' }
        pairingOpen: { type: boolean }
    PairRequest:
      type: object
      required: [method, clientId, clientName, clientNonce, proof]
      properties:
        method: { type: string, enum: [qr, pin] }
        clientId: { $ref: '#/components/schemas/Uuid' }
        clientName: { type: string, minLength: 1, maxLength: 64 }
        clientNonce: { $ref: '#/components/schemas/B64U32' }
        proof: { $ref: '#/components/schemas/B64U32' }
    PairResponse:
      type: object
      required: [deviceId, deviceName, deviceNonce, proof]
      properties:
        deviceId: { $ref: '#/components/schemas/Uuid' }
        deviceName: { type: string }
        deviceNonce: { $ref: '#/components/schemas/B64U32' }
        proof: { $ref: '#/components/schemas/B64U32' }
    Device:
      type: object
      required: [deviceId, deviceName, model, platform, os, osVersion, pakVersion, network, battery, storage, uptimeSeconds]
      properties:
        deviceId: { $ref: '#/components/schemas/Uuid' }
        deviceName: { type: string }
        model: { $ref: '#/components/schemas/Model' }
        platform: { type: string }
        os: { type: string }
        osVersion: { type: [string, 'null'] }
        pakVersion: { type: string }
        network:
          type: object
          required: [ipv4, ssid]
          properties:
            ipv4: { type: string, format: ipv4 }
            ssid: { type: [string, 'null'] }
        battery:
          type: [object, 'null']
          required: [percent, charging]
          properties:
            percent: { type: integer, minimum: 0, maximum: 100 }
            charging: { type: boolean }
        storage:
          type: array
          items: { $ref: '#/components/schemas/Storage' }
        uptimeSeconds: { type: integer, format: int64, minimum: 0 }
    Storage:
      type: object
      required: [id, label, totalBytes, freeBytes]
      properties:
        id: { type: string }
        label: { type: string }
        totalBytes: { $ref: '#/components/schemas/Bytes' }
        freeBytes: { $ref: '#/components/schemas/Bytes' }

    System:
      type: object
      required: [id, label, folder, tag, gameCount]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        label: { type: string, description: Folder name without the sort prefix nor the tag. }
        folder: { type: string }
        tag: { type: string }
        gameCount: { type: integer, minimum: 0 }
    SystemList:
      type: object
      required: [systems]
      properties:
        systems:
          type: array
          items: { $ref: '#/components/schemas/System' }
    Folder:
      type: object
      required: [id, name, gameCount]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        name: { type: string }
        gameCount: { type: integer, minimum: 0 }
    GameKind:
      type: string
      enum: [file, m3u, folder-m3u]
      description: '`file` (single ROM), `m3u` (`.m3u` file), `folder-m3u` (folder holding a `.m3u` of the same name).'
    Game:
      type: object
      required: [id, name, fileName, kind, sizeBytes, modifiedAt, hasSave, stateCount, lockedStateCount, cheatCount, hasArt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        name: { type: string }
        fileName: { type: string }
        kind: { $ref: '#/components/schemas/GameKind' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        modifiedAt: { $ref: '#/components/schemas/Timestamp' }
        hasSave: { type: boolean }
        stateCount: { type: integer, minimum: 0 }
        lockedStateCount: { type: integer, minimum: 0 }
        cheatCount: { type: integer, minimum: 0 }
        hasArt: { type: boolean }
    GameListing:
      type: object
      required: [folders, games]
      properties:
        folders:
          type: array
          items: { $ref: '#/components/schemas/Folder' }
        games:
          type: array
          items: { $ref: '#/components/schemas/Game' }
    GameFile:
      type: object
      required: [role, path, sizeBytes, modifiedAt]
      properties:
        role: { type: string, enum: [rom, save, state, cheats, art] }
        slot: { type: integer, minimum: 0, description: Only for `state`. }
        path: { type: string, description: 'Informative, relative to the SD card root. Never sent back.' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        modifiedAt: { $ref: '#/components/schemas/Timestamp' }
    GameDetail:
      type: object
      required: [id, systemId, name, fileName, kind, files, totalBytes]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        systemId: { $ref: '#/components/schemas/OpaqueId' }
        name: { type: string }
        fileName: { type: string }
        kind: { $ref: '#/components/schemas/GameKind' }
        files:
          type: array
          items: { $ref: '#/components/schemas/GameFile' }
        totalBytes: { $ref: '#/components/schemas/Bytes' }

    TrashMoveResult:
      type: object
      required: [trashEntryId, moved, movedBytes]
      properties:
        trashEntryId: { $ref: '#/components/schemas/OpaqueId' }
        moved:
          type: array
          description: Original paths, relative to the SD card root (informative).
          items: { type: string }
        movedBytes: { $ref: '#/components/schemas/Bytes' }
    TrashEntry:
      type: object
      required: [id, trashedAt, reason, label, files, sizeBytes, expiresAt]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        trashedAt: { $ref: '#/components/schemas/Timestamp' }
        reason: { type: string, enum: [delete-game, delete-state, overwrite, replace-rom, lock-restore, restore] }
        label: { type: string }
        files:
          type: array
          items: { type: string }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    TrashList:
      type: object
      required: [entries, totalBytes]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/TrashEntry' }
        totalBytes: { $ref: '#/components/schemas/Bytes' }
    FreedBytes:
      type: object
      required: [freedBytes]
      properties:
        freedBytes: { $ref: '#/components/schemas/Bytes' }

    Backup:
      type: object
      required: [id, label, createdAt, sizeBytes, reason]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        label: { type: [string, 'null'], maxLength: 80 }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        reason: { type: string, enum: [manual, before-replace, before-restore, before-delete, before-patch] }
    BackupList:
      type: object
      required: [backups]
      properties:
        backups:
          type: array
          items: { $ref: '#/components/schemas/Backup' }
    BackupResult:
      type: object
      required: [backup]
      properties:
        backup:
          oneOf:
            - $ref: '#/components/schemas/Backup'
            - type: 'null'
    CreateBackupRequest:
      type: object
      properties:
        label: { type: string, maxLength: 80 }

    Slot:
      type: object
      required: [slot, sizeBytes, modifiedAt, hasThumbnail, locked, lockStatus]
      properties:
        slot: { type: integer, minimum: 0 }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        modifiedAt: { $ref: '#/components/schemas/Timestamp' }
        hasThumbnail: { type: boolean }
        locked: { type: boolean }
        lockStatus:
          type: [string, 'null']
          enum: [intact, restored, missing, null]
          description: '`intact` (same as the locked copy), `restored` (overwritten in game, restored at pak start), `missing` (state gone, locked copy present); null when not locked.'
    SlotList:
      type: object
      required: [slots, resumeSlot]
      properties:
        slots:
          type: array
          items: { $ref: '#/components/schemas/Slot' }
        resumeSlot:
          type: [integer, 'null']
          minimum: 0
          description: Slot of the automatic resume state, if any.
    ResumeHistoryEntry:
      type: object
      required: [id, capturedAt, sizeBytes]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        capturedAt: { $ref: '#/components/schemas/Timestamp' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
    ResumeHistory:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/ResumeHistoryEntry' }

    Cheat:
      type: object
      required: [description, code, enabled]
      properties:
        index: { type: integer, minimum: 0, description: Position in the file (cheats are renumbered on write). }
        description: { type: string }
        code: { type: string }
        enabled: { type: boolean }
        extra:
          type: object
          description: Unknown `.cht` keys of this cheat, kept as is.
          additionalProperties: { type: string }
    CheatList:
      type: object
      required: [cheats, etag]
      properties:
        cheats:
          type: array
          items: { $ref: '#/components/schemas/Cheat' }
        etag: { type: string }
    CheatsUpdate:
      type: object
      required: [cheats]
      properties:
        cheats:
          type: array
          items: { $ref: '#/components/schemas/Cheat' }
    CheatImportRequest:
      type: object
      required: [source, mode]
      properties:
        source:
          oneOf:
            - type: object
              required: [type, url]
              properties:
                type: { type: string, const: url }
                url: { type: string, format: uri }
            - type: object
              required: [type, sdFileId]
              properties:
                type: { type: string, const: sd }
                sdFileId: { $ref: '#/components/schemas/OpaqueId' }
            - type: object
              required: [type, text]
              properties:
                type: { type: string, const: inline }
                text: { type: string }
            - type: object
              required: [type, uploadId]
              properties:
                type: { type: string, const: upload }
                uploadId: { $ref: '#/components/schemas/OpaqueId' }
        mode: { type: string, enum: [merge, replace] }
    CheatImportResult:
      type: object
      required: [imported, total]
      properties:
        imported: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    SdFile:
      type: object
      required: [id, path, sizeBytes]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        path: { type: string, description: 'Informative, relative to the SD card root.' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
    SdFileList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/SdFile' }

    OnConflict:
      type: string
      enum: [fail, rename, overwrite]
      default: fail
    UploadTarget:
      description: Destination of an upload.
      oneOf:
        - type: object
          required: [kind, systemId, fileName]
          properties:
            kind: { type: string, const: rom }
            systemId: { $ref: '#/components/schemas/OpaqueId' }
            folderId:
              oneOf:
                - $ref: '#/components/schemas/OpaqueId'
                - type: 'null'
            fileName: { $ref: '#/components/schemas/FileName' }
        - type: object
          required: [kind, gameId]
          properties:
            kind: { type: string, const: save }
            gameId: { $ref: '#/components/schemas/OpaqueId' }
        - type: object
          required: [kind, gameId, slot]
          properties:
            kind: { type: string, const: state }
            gameId: { $ref: '#/components/schemas/OpaqueId' }
            slot: { type: integer, minimum: 0 }
        - type: object
          required: [kind, fileName]
          properties:
            kind: { type: string, const: staging }
            fileName: { $ref: '#/components/schemas/FileName' }
    DownloadTarget:
      description: Same as UploadTarget, but `fileName` is optional (deduced from `Content-Disposition` or the URL).
      oneOf:
        - type: object
          required: [kind, systemId]
          properties:
            kind: { type: string, const: rom }
            systemId: { $ref: '#/components/schemas/OpaqueId' }
            folderId:
              oneOf:
                - $ref: '#/components/schemas/OpaqueId'
                - type: 'null'
            fileName: { $ref: '#/components/schemas/FileName' }
        - type: object
          required: [kind, gameId]
          properties:
            kind: { type: string, const: save }
            gameId: { $ref: '#/components/schemas/OpaqueId' }
        - type: object
          required: [kind, gameId, slot]
          properties:
            kind: { type: string, const: state }
            gameId: { $ref: '#/components/schemas/OpaqueId' }
            slot: { type: integer, minimum: 0 }
        - type: object
          required: [kind]
          properties:
            kind: { type: string, const: staging }
            fileName: { $ref: '#/components/schemas/FileName' }
    CreateUploadRequest:
      type: object
      required: [target, sizeBytes, sha256]
      properties:
        target: { $ref: '#/components/schemas/UploadTarget' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
        sha256: { $ref: '#/components/schemas/Sha256Hex' }
        onConflict: { $ref: '#/components/schemas/OnConflict' }
    UploadCreated:
      type: object
      required: [uploadId, chunkSize, offset, expiresAt]
      properties:
        uploadId: { $ref: '#/components/schemas/OpaqueId' }
        chunkSize: { type: integer, format: int64, minimum: 1, maximum: 16777216 }
        offset: { $ref: '#/components/schemas/Bytes' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
    UploadStatus:
      type: object
      required: [uploadId, offset, sizeBytes]
      properties:
        uploadId: { $ref: '#/components/schemas/OpaqueId' }
        offset: { $ref: '#/components/schemas/Bytes' }
        sizeBytes: { $ref: '#/components/schemas/Bytes' }
    UploadResult:
      description: Depends on `target.kind`.
      oneOf:
        - type: object
          required: [gameId]
          properties:
            gameId: { $ref: '#/components/schemas/OpaqueId' }
        - $ref: '#/components/schemas/BackupResult'
        - type: object
          required: [slot]
          properties:
            slot: { $ref: '#/components/schemas/Slot' }
        - type: object
          required: [stagingId]
          properties:
            stagingId: { $ref: '#/components/schemas/OpaqueId' }
    DownloadRequest:
      type: object
      required: [url, target]
      properties:
        url: { type: string, format: uri, description: '`http` or `https` only.' }
        target: { $ref: '#/components/schemas/DownloadTarget' }
        sha256:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
        onConflict: { $ref: '#/components/schemas/OnConflict' }
    PatchRequest:
      type: object
      required: [patch]
      properties:
        patch:
          oneOf:
            - type: object
              required: [type, stagingId]
              properties:
                type: { type: string, const: staging }
                stagingId: { $ref: '#/components/schemas/OpaqueId' }
            - type: object
              required: [type, sdFileId]
              properties:
                type: { type: string, const: sd }
                sdFileId: { $ref: '#/components/schemas/OpaqueId' }
        output:
          type: object
          properties:
            mode: { type: string, enum: [new-file, replace], default: new-file }
            fileName: { $ref: '#/components/schemas/FileName' }
    JobAccepted:
      type: object
      required: [jobId]
      properties:
        jobId: { $ref: '#/components/schemas/OpaqueId' }
    Job:
      type: object
      required: [id, kind, state, progress, createdAt, updatedAt, result, error]
      properties:
        id: { $ref: '#/components/schemas/OpaqueId' }
        kind: { type: string, enum: [download, patch] }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        progress:
          type: object
          required: [done, total]
          properties:
            done: { $ref: '#/components/schemas/Bytes' }
            total:
              type: [integer, 'null']
              format: int64
              minimum: 0
              description: Null when unknown.
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
        result:
          type: [object, 'null']
          description: "The created resource when `succeeded`, e.g. `{ \"gameId\": \"...\" }`."
          additionalProperties: true
        error:
          description: Same object as in error responses, when `failed`.
          oneOf:
            - $ref: '#/components/schemas/ErrorBody'
            - type: 'null'
    JobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items: { $ref: '#/components/schemas/Job' }
