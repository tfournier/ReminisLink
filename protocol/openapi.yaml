openapi: 3.1.0
info:
  title: ReminisLink API
  version: 2.0.0
  summary: HTTP API served by the ReminisLink pak on the handheld, used by the iOS app.
  description: |
    Source of truth for both implementations (Go pak and Swift app). It is
    derived from `docs/specs/03-protocole.md` and `docs/specs/04-api-v1.md`;
    any API change is made here first.

    ## Transport
    HTTPS (TLS 1.2 or later, TLS 1.3 preferred) on the local network, M13.
    Default port 47821 (the pak tries the 9 next ports if it is busy; the
    real port is announced with Bonjour `_reminislink._tcp` and in the
    pairing QR code). Every route, `GET /hello` included, is served over
    TLS only; the pak serves no plain HTTP. All paths below are relative to
    the `/api/v1` prefix. JSON bodies are UTF-8, `camelCase`, at most 1 MiB.
    Dates are RFC 3339 UTC, sizes are 64-bit byte counts. Clients must
    ignore unknown fields.

    **Certificate and pin.** On its first launch the pak creates an ECDSA
    P-256 key and a self-signed X.509 certificate (common name: the
    `deviceId`, long validity), kept on the SD card, and reuses them at
    every launch. The **pin** is b64u(SHA-256(DER of the certificate's
    SubjectPublicKeyInfo)), carried by the pairing link (`k`, see
    `POST /pair`). The app accepts only the certificate whose public key
    matches the pin of the console (pinning): no system trust, no CA, no
    host name check. A connection whose pin differs is closed before any
    request is sent. If the certificate is lost (card reformatted), the
    pin changes and the console must be paired again. Bonjour does not
    carry the pin: it only comes from the QR code. An app that holds an
    older (RL1) pairing, without a pin, may read `GET /hello` without
    pinning only to see `apiVersion: 2` and offer to pair again; it sends
    nothing else on such a connection.

    ## Identifiers
    `systemId`, `gameId` and `folderId` are base64url (no padding) of a path
    relative to `Roms/`; `sdFileId`, `stagingId`, `backupId`, `entryId`,
    `trashEntryId`, `uploadId`, `jobId`, `fileId` (M11), `pakId` and
    `sdEntryId` (M12) are generated by the pak. All are
    **opaque**: the app never builds nor decodes them, it sends them back as
    received. An unreadable identifier, or one that resolves outside its root,
    is answered with `400 invalid_id`. `path` fields in responses are
    informative only and are never sent back.

    ## Request signing (RL2-ED25519, M13)
    Every route except `GET /hello` and `POST /pair` is signed with the
    client's Ed25519 private key, registered at pairing (the pak keeps
    only the public key). The five `X-RL-*` headers (see the security
    schemes) carry the signature of this canonical string (lines joined
    with `\n`, no trailing newline):

    ```
    RL2-ED25519
    <METHOD in uppercase>
    <path as sent on the request line, still percent-encoded, with /api/v1, without the query>
    <canonical query>
    <X-RL-Time>
    <X-RL-Nonce>
    <X-RL-Content-SHA256>
    ```

    `X-RL-Signature` = b64u of the 64-byte Ed25519 signature (RFC 8032) of
    the UTF-8 canonical string.

    Canonical query: the raw query is split on `&`, each pair at its first
    `=`, decoded (`+` is a space, `%XX` a byte), re-encoded per RFC 3986
    (only `A-Z a-z 0-9 - . _ ~` stay as is, `%XX` in uppercase), sorted by
    encoded key then encoded value (byte order) and joined as `key=value`
    with `&`. Empty when there is no parameter. Clients send queries already
    in this encoding (a literal `+` is `%2B`, a space `%20`).

    The pak checks, in this order: unknown client (`401 unknown_client`);
    malformed signature headers (`401 bad_signature`); clock skew above 300 s
    (`401 clock_skew`, the app corrects with `serverTime` from `/hello` and
    retries once); nonce already used in the last 10 minutes
    (`401 replayed_request`); Ed25519 signature, then body SHA-256 (both
    `401 bad_signature`; the body of a request whose signature is wrong is
    never read). The nonce is reserved as soon as the signature
    is valid, before the body is read: any later failure (body hash, size)
    consumes it, and the app retries with a new nonce. A request with a
    valid signature from a client disconnected by the console then gets
    `401 disconnected` (M10), except `POST /clients/me/connect`. A signed body is
    limited to 1 MiB (64 MiB for `PUT /games/{gameId}/save`, 4 MiB for
    `PUT /games/{gameId}/art`, 16 MiB for an upload chunk sent with its
    SHA-256), otherwise `413 too_large`; these
    limits are fixed per route. If the device cannot remember more nonces,
    it answers `429 too_many_attempts` with `Retry-After`.

    **`X-RL-Platform`** (informative, not signed, optional): the kind of
    device sending the request, one of `iphone`, `ipad`, `mac`, `android`,
    `web`. The pak only uses it to show, on its Devices screen, the
    platforms recently seen for each paired client (several Apple devices
    can share one pairing through the iCloud Keychain). Other values are
    ignored. It is never used for any decision.

    Shared test vectors: `protocol/test-vectors/` (`pairing.json`,
    `signing.json`, `tls.json`, `ids.json`).

    ## Errors
    Every error has the body `{ "error": { "code", "message", "details" } }`.
    `message` is English, for logs; the app shows a translated text chosen
    from `code`.

    ## Writes one at a time (M13)
    Several paired clients may act at the same time; there is no write
    lease and no read-only client (the M10 lease, `/writer` and
    `423 read_only` are gone). The pak runs the operations that change the
    SD card one at a time: deletions, replacements, restores, save
    backups, cheats (an import waits once its source is read), art,
    trash, state locks, the deletion of a pak (M12), and the final step of
    an upload (`POST /uploads/{uploadId}/complete`). Creating or cancelling an
    upload, its chunks (`PUT /uploads/{uploadId}`) and cancelling a job
    only touch the staging area of the pak and never wait. A patch or a
    pak installation (a job) waits for its turn only for the step that installs its file (or its pak
    folder), never failing for it. A request that arrives while another write runs waits for it
    to finish (after its body was received and verified); if it waited
    10 s without getting its turn, it gets `429 device_busy`
    (message `Device busy`) with `Retry-After`, and nothing was changed.
    The dedicated code `device_busy` came after M13: a pak from M13 sent
    `429 too_many_attempts` with the message `Device busy` instead, so a
    client keeps recognizing that answer too.
    Once it holds its turn, a write checks again that its client was not
    disconnected, forgotten, unpaired or paired again meanwhile
    (`401 disconnected` or `401 unknown_client`, nothing changed). The
    queued and running jobs of a revoked client are cancelled (a job
    already installing its file finishes).
    The confirmation of a game deletion still shows the preview computed
    by the pak (`GET /games/{gameId}/deletion`); a change made by another
    client between the preview and the deletion is an accepted risk (every
    deleted or replaced file stays 30 days in the trash).

    - The console can **disconnect** a client (Settings > Devices): all its
      signed requests get `401 disconnected` until it calls
      `POST /clients/me/connect`, which the app only does on an explicit
      user action. This state is kept in memory only. The console can also
      **forget** a client (or all of them): its pairing is removed
      (`401 unknown_client` afterwards).
servers:
  - url: https://{host}:{port}/api/v1
    description: ReminisLink pak on the local network (TLS, self-signed certificate pinned by the app)
    variables:
      host:
        default: 192.168.1.42
        description: IPv4 address resolved with Bonjour (or from the pairing link, see `POST /pair`)
      port:
        default: '47821'
        description: Port announced with Bonjour
security:
  - rlClient: []
    rlTime: []
    rlNonce: []
    rlContentSha256: []
    rlSignature: []
tags:
  - name: Device
    description: Handshake, pairing and device state.
  - name: Library
    description: Systems, folders and games.
  - name: Trash
    description: Files moved away by destructive operations, kept 30 days.
  - name: Saves
    description: In-game saves and their backup copies.
  - name: States
    description: Emulator save states, locks and resume history.
  - name: Cheats
    description: RetroArch `.cht` cheat lists.
  - name: Transfers
    description: Resumable uploads and patching.
  - name: Jobs
    description: Long-running device-side operations.
  - name: Paks
    description: Tool and emulator paks of the console (M12).
  - name: SD
    description: Read-only browser of the SD card (M12).
  - name: Archives
    description: A game's data as a zip archive, exported and imported between consoles (M19).

paths:
  /hello:
    get:
      tags: [Device]
      operationId: getHello
      summary: Introduce the device (unsigned)
      description: |
        Checks that the app talks to the expected device, measures the clock
        skew and checks compatibility. Rate-limited to 10 requests per second
        per IP. Returns nothing else (no games, no clients).

        `pairingOpen` (M8): pairing is only open while the console shows the
        pairing QR code (main screen while no device is paired, otherwise
        Settings > Pair a new device) and is not blocked after too many
        failures. It is `false` otherwise: the app then asks the user to
        open the pairing screen on the console.

        `apiVersion` is `2` since M13 (TLS, pairing v2, RL2-ED25519
        signing). An app paired with an older pak (RL1) that sees `2` offers
        to pair again: the pak erased its RL1 pairings.

        Compatibility (M17), checked by the app on every `/hello`, both
        ways, with versions compared number by number (a `-suffix` such as
        `-beta.1` is ignored):
        - `minClientVersion` is the oldest **client protocol version**
          (`X.Y.Z`) this pak supports, one value for every client (iOS,
          Android, web). It is not an app's store version: each client
          compares it with its own protocol version constant (`1.0.0` so
          far), raised only when the client starts to require or understand
          a protocol change. An older client asks the user to update the
          app. Paks v1.0.x send `1.0.0`.
        - The app knows the oldest pak it can drive (`minPakVersion`, in
          the app) and compares it with `pakVersion`. An older pak: the app
          asks the user to update ReminisLink on the console. A
          `pakVersion` that is not a version number (a development build:
          `dev` or a commit hash) is accepted.
        - An `apiVersion` other than the app's: lower, update the pak;
          higher, update the app.

        Changes that keep both sides working need none of this: new fields
        and routes stay optional for the other side.
      security: []
      responses:
        '200':
          description: Device introduction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hello' }
              example:
                deviceId: 7f3a9c2e-1b4d-4c55-9a51-2f0f9e7d3a10
                deviceName: Brick de Thomas
                model: brick
                platform: tg5040
                os: nextui
                osVersion: NextUI-20261013-039a06de
                pakVersion: 1.0.0
                apiVersion: 2
                minClientVersion: 1.0.0
                serverTime: '2026-11-18T17:00:00Z'
                pairingOpen: true
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /pair:
    post:
      tags: [Device]
      operationId: pair
      summary: Pair the app with the device (unsigned)
      description: |
        Pairing v2 (M13, 03-protocole §3). The console shows a QR code
        holding the **pairing link**:

        `reminislink://pair?v=2&id=<deviceId>&n=<name>&s=<secret>&h=<IPv4>&p=<port>&k=<pin>`

        `n` is percent-encoded per RFC 3986; `s` is the 32-byte pairing
        secret in b64u (random, single use, valid 10 minutes); `h` and `p`
        are the address and port of the console; `k` is the pin of its
        certificate (b64u(SHA-256(SPKI DER)), see Transport). The app
        refuses a link whose `v` is not `2` (an older pak: "update the
        ReminisLink pak"). The app finds the console with Bonjour by `id`;
        when Bonjour does not answer, it MAY connect to `h`:`p`, because the
        pin authenticates the console. Every connection is pinned to `k`.

        Over that pinned connection the app sends its Ed25519 public key
        with an HMAC proof that it read the QR code; the pak answers with
        its own proof. With `secret` the 32 bytes of `s` and every other
        value the exact string sent (b64u for keys and nonces):

        - client `proof` = b64u(HMAC-SHA256(secret, `RL2-PAIR-CLIENT|` + deviceId + `|` + clientId + `|` + clientPublicKey + `|` + clientNonce));
        - device `proof` = b64u(HMAC-SHA256(secret, `RL2-PAIR-DEVICE|` + deviceId + `|` + clientId + `|` + clientPublicKey + `|` + clientNonce + `|` + deviceNonce)).

        The pak stores `clientId`, `clientName`, `platform` and
        `clientPublicKey`; no shared key is derived and no secret is kept.
        A wrong proof or an expired secret gives `401 pairing_failed`; after
        5 failures the secret is regenerated and pairing is blocked for 30 s
        (`429 too_many_attempts`). The secret is single use. Pairing again
        with the same `clientId` replaces its public key and platform.
        There is no PIN. Rate-limited per IP.

        `platform` is the kind of client: `apple` (an identity shared by the
        iPhone, iPad and Mac of one Apple account through the iCloud
        Keychain), `android`, `web` or `other`.

        Pairing on demand (M8): pairing is only open while the console shows
        the QR code (`pairingOpen` of `GET /hello`). While it is closed,
        every well-formed request gets `401 pairing_failed` and does not
        count as a failure. The secret is drawn again each time the pairing
        screen opens and is invalidated when it closes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairRequest' }
            example:
              clientId: 3b1c8d2a-5e6f-4a7b-8c9d-0e1f2a3b4c5d
              clientName: Thomas
              platform: apple
              clientPublicKey: w8cDzxkGI2CkPhdYLQGftWTd3szMwBSkA8KaPCy1s6k
              clientNonce: SzpTB2xxxaK_3oWNbw77ffxKLhLfXjFftWRpnp1E9Ec
              proof: Zq5wX5uDY9uFR03YZrkrJDOE9UpkL5G-wX0VvaoNmD0
      responses:
        '200':
          description: Paired. The app checks `proof` before storing the pairing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairResponse' }
              example:
                deviceId: 7f3a9c2e-1b4d-4c55-9a51-2f0f9e7d3a10
                deviceName: Brick de Thomas
                deviceNonce: gmW5fAqc_r6XsaNaUW5N-Al-5L9pDTYkfmSzW5LBDC4
                proof: N5YeK3s4c1RX8moNmuvjviGxavLlgmO5oIig6CtxuFk
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/PairingFailed' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyAttempts' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /clients/me:
    delete:
      tags: [Device]
      operationId: unpair
      summary: Unpair the calling client
      description: 'Removes the calling client from the device. The app then forgets this console; its own key stays, since it may serve other consoles and devices.'
      responses:
        '204': { description: Unpaired. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /clients/me/connect:
    post:
      tags: [Device]
      operationId: connectClient
      summary: Reconnect after a disconnection by the console (M10)
      description: |
        Lifts the disconnection set from the console (Settings > Devices)
        for the calling client. The app calls it only on an explicit user
        action (the user opens this console or taps "Reconnect"), never from
        an automatic reconnection. No effect for a client that is not
        disconnected.
      responses:
        '204': { description: Connected. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /device:
    get:
      tags: [Device]
      operationId: getDevice
      summary: Device state
      responses:
        '200':
          description: |
            Device state. `ssid`, `battery` and `osVersion` may be null when
            unknown. `connectedClients` lists the paired clients with a signed
            request accepted in the last 30 seconds or an open event stream
            (`GET /events`, M14), the caller included; the pak keeps it in
            memory only (empty at launch).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
              example:
                deviceId: 7f3a9c2e-1b4d-4c55-9a51-2f0f9e7d3a10
                deviceName: Brick de Thomas
                model: brick
                platform: tg5040
                os: nextui
                osVersion: NextUI-20261013-039a06de
                pakVersion: 1.0.0
                network: { ipv4: 192.168.1.42, ssid: MaBox }
                battery: { percent: 78, charging: false }
                storage:
                  - { id: sd, label: SD, totalBytes: 127865454592, freeBytes: 40265318400 }
                uptimeSeconds: 512
                connectedClients:
                  - { clientName: iPhone de Thomas, lastSeenAt: '2026-11-18T17:00:00Z' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /events:
    get:
      tags: [Device]
      operationId: streamEvents
      summary: Stream of device events (M14)
      description: |
        Server-Sent Events (`text/event-stream`, UTF-8). The request is
        signed like any other; it is checked once, when the stream opens.
        The stream stays open while the pak runs. Each event is
        `id: <n>` (increasing within the stream), `event: <type>` and one
        `data: <JSON>` line, then a blank line. `Last-Event-ID` is ignored:
        after a reconnection the app reloads the state it shows.

        - `hello` (first event): `EventHello`.
        - Keep-alive: a comment line `: keep-alive` at least every 15 s.
          The app treats 35 s without any byte as a lost connection.
        - `shutdown`: `EventShutdown`, sent when the pak starts closing
          (quit from the console, or the system stopping it), just before
          the stream ends. Then the connection closes. Events still waiting
          for the end of their interval (a merged `library`, a job's
          progress) are sent at once, before `shutdown`. All final writes
          must finish within 1 s of the start of the shutdown; a client that
          no longer reads is cut without delaying it.
        - `device`: `EventDevice`, when the battery (percent or charging),
          the connected clients or the free space change; at most one
          every 5 s.
        - `library`: `EventLibrary`, after any change of the SD card made
          through the API by any client (upload installed, deletion,
          replacement, restore, patch, archive import, cheats, art, trash), so the app
          refreshes what it shows. At most one every second (changes are
          merged).
        - `job`: a `Job`, when a job of any client changes state, and
          while it runs at most once per second.
        - `paks` (M12): `EventPaks` (an empty object), after a pak was
          installed (a `pak-install` job that succeeded) or deleted by any
          client, so the
          app reloads `GET /paks`. At most one every second (changes are
          merged). A pak change does not send `library`.

        The pak ends the stream of a client that is disconnected or
        forgotten from the console (M10), unpaired, or when it closes. At
        most 4 open streams per client and 16 in all: beyond,
        `429 too_many_attempts`. Clients must ignore unknown event types.
      responses:
        '200':
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: 'Event stream; the `data` of each event type is one of the schemas below (`job` carries a `Job`).'
                contentSchema:
                  description: 'Not a JSON document: documents the `data` of each event (`hello`, `shutdown`, `device`, `library`, `job`, `paks`).'
                  oneOf:
                    - { $ref: '#/components/schemas/EventHello' }
                    - { $ref: '#/components/schemas/EventShutdown' }
                    - { $ref: '#/components/schemas/EventDevice' }
                    - { $ref: '#/components/schemas/EventLibrary' }
                    - { $ref: '#/components/schemas/Job' }
                    - { $ref: '#/components/schemas/EventPaks' }
              example: |
                id: 1
                event: hello
                data: {"serverTime":"2026-11-20T08:00:00Z","keepAliveSeconds":15}

                : keep-alive

                id: 2
                event: library
                data: {"systemIds":["R2FtZSBCb3kgQWR2YW5jZSAoR0JBKQ"]}

                id: 3
                event: shutdown
                data: {"reason":"quit"}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /systems:
    get:
      tags: [Library]
      operationId: listSystems
      summary: List the systems
      description: |
        Folders of `Roms/` with a `(TAG)` suffix and at least one visible item.
        The leading sort number (`01) `, `02_`...) is removed from `label`.
        Sorted alphabetically, case-insensitive. Every such folder is listed,
        even when NextUI hides it: `emulatorInstalled` tells whether an
        emulator pak `<TAG>.pak` exists (NextUI only shows the folder then).
        NextUI also merges, for display, folders with the same name before
        `(`; the data stays separate per tag, merging is left to the app.
      responses:
        '200':
          description: Systems.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemList' }
              example:
                systems:
                  - id: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKQ
                    label: Game Boy Advance
                    folder: Game Boy Advance (GBA)
                    tag: GBA
                    gameCount: 42
                    emulatorInstalled: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /systems/{systemId}/games:
    get:
      tags: [Library]
      operationId: listSystemGames
      summary: List a folder of a system
      description: |
        Without `folderId`, the root of the system. Ignored files are those of
        Cheat Manager (`.txt`, `.png`, `.sav`, `.cht`, `.bak`...) and hidden
        files.
      parameters:
        - $ref: '#/components/parameters/SystemId'
        - name: folderId
          in: query
          required: false
          description: Folder identifier returned by a previous call, to list a subfolder.
          schema: { $ref: '#/components/schemas/OpaqueId' }
          example: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9IYWNrcw
      responses:
        '200':
          description: Folders and games of the folder.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameListing' }
              example:
                folders:
                  - { id: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9IYWNrcw, name: Hacks, gameCount: 3 }
                games:
                  - id: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Ta3kgR2FyZGVuIFF1ZXN0LmdiYQ
                    name: Sky Garden Quest
                    fileName: Sky Garden Quest.gba
                    kind: file
                    sizeBytes: 16777216
                    modifiedAt: '2026-10-02T09:12:00Z'
                    hasSave: true
                    stateCount: 3
                    lockedStateCount: 1
                    cheatCount: 12
                    hasArt: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games:
    get:
      tags: [Library]
      operationId: listAllGames
      summary: List every game of every system (M11)
      description: |
        The games of all the systems of `GET /systems`, subfolders included,
        in one flat list, for the app's library (search and filters are done
        by the app). Same rules as `GET /systems/{systemId}/games` for what
        is a game. Sorted by system folder, then by path, case-insensitive.
        At most 20 000 games: beyond, `truncated` is true and the app falls
        back to browsing per system.
      responses:
        '200':
          description: All the games.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllGames' }
              example:
                games:
                  - id: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Ta3kgR2FyZGVuIFF1ZXN0LmdiYQ
                    systemId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKQ
                    folderId: null
                    folderPath: null
                    name: Sky Garden Quest
                    fileName: Sky Garden Quest.gba
                    kind: file
                    sizeBytes: 16777216
                    modifiedAt: '2026-10-02T09:12:00Z'
                    hasSave: true
                    stateCount: 3
                    lockedStateCount: 1
                    cheatCount: 12
                    hasArt: true
                truncated: false
                generatedAt: '2026-11-19T21:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/files/{fileId}:
    get:
      tags: [Library]
      operationId: downloadGameFile
      summary: Download one file of a game (M11)
      description: |
        Streams one file listed in `files` of `GET /games/{gameId}` (ROM,
        disc, playlist, save, clock file, state, cheats, art) so the user can
        keep a copy on the phone. The pak only serves a file that is in the
        game's current file list, resolved again for this request: a
        `fileId` that is not (any more) in it gets `404 not_found`, as does a
        symbolic link, a path reached through one or outside the expected
        root. The whole file is sent (no `Range` in this version).
        `Content-Length` is set. Read route: never waits for a write.
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: fileId
          in: path
          required: true
          description: '`fileId` of an entry of `GameDetail.files`.'
          schema: { $ref: '#/components/schemas/OpaqueId' }
          example: Zl9yb20
      responses:
        '200':
          description: The file.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
          content:
            application/octet-stream:
              schema: { $ref: '#/components/schemas/Binary' }
              example: '<binary file content>'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/archive:
    get:
      tags: [Archives]
      operationId: exportGameArchive
      summary: Export the data of a game as a zip archive (M19)
      description: |
        Streams a zip archive of the game's data so the user can keep it on
        the phone or import it on this console or another one
        (`GET /archives/{stagingId}`, `POST /archives/{stagingId}/import`).
        Built by the pak from the game's current files (same resolution
        as `GET /games/{gameId}`): the save, its clock file (`.rtc`), every
        state with its thumbnail, the cheats and the art; with `rom=true`,
        the ROM too (single-file games only: an `m3u`, `folder-m3u` or
        `folder-cue` game answers `422 unsupported_format` with `rom=true`).
        Locked copies, the resume history and save backups are not
        exported. Read route: never waits for a write (each file is read
        through an open descriptor; the pak replaces files by renaming new
        ones over them, so every file of the archive is whole). Files are
        opened confined as in `GET /games/{gameId}/files/{fileId}` (no
        link, under the folder of their role); a refused or vanished file
        is left out of the archive. A game with nothing to export answers
        `404 not_found`.

        **Format** (`GameArchiveManifest`, version 1): a zip (stored or
        deflated entries, zip64 when needed) whose `manifest.json` lists
        every other file entry with its `role`, `slot` (states and
        thumbnails), `sizeBytes` and `sha256`. Entry paths are informative
        (`save/…`, `rtc/…`, `states/<slot>/…`, `cheats/…`, `art/…`,
        `rom/…`): an importer maps each file by its role, never by its
        path, to the names the target console uses for the target game.
        The manifest is written last (its hashes are those of the bytes
        streamed).

        Response: `Content-Type: application/zip`, `Content-Disposition:
        attachment; filename="<game name>.reminislink.zip"`; no
        `Content-Length` (the archive is streamed as it is built). Written
        in chunks of at most 32 KiB, each with a 60 s timeout, like the
        other file downloads.
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: rom
          in: query
          required: false
          description: Include the ROM (single-file games only). Default `false`.
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: The archive.
          headers:
            Content-Disposition: { $ref: '#/components/headers/ContentDisposition' }
          content:
            application/zip:
              schema: { type: string, contentMediaType: application/zip }
              example: '<zip archive>'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}:
    get:
      tags: [Library]
      operationId: getGame
      summary: Game detail and its files
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: The game and every file that belongs to it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetail' }
              example:
                id: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Ta3kgR2FyZGVuIFF1ZXN0LmdiYQ
                systemId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKQ
                name: Sky Garden Quest
                fileName: Sky Garden Quest.gba
                kind: file
                files:
                  - { fileId: Zl9yb20, role: rom, path: Roms/Game Boy Advance (GBA)/Sky Garden Quest.gba, sizeBytes: 16777216, modifiedAt: '2026-10-02T09:12:00Z' }
                  - { fileId: Zl9zYXZl, role: save, path: Saves/GBA/Sky Garden Quest.gba.sav, sizeBytes: 131072, modifiedAt: '2026-11-18T16:55:00Z' }
                  - { fileId: Zl9zdDA, role: state, slot: 0, path: .userdata/shared/.minui/GBA/Sky Garden Quest.gba.st0, sizeBytes: 401408, modifiedAt: '2026-11-18T16:55:00Z' }
                  - { fileId: Zl9jaHQ, role: cheats, path: Cheats/GBA/Sky Garden Quest.gba.cht, sizeBytes: 2048, modifiedAt: '2026-10-02T09:12:00Z' }
                  - { fileId: Zl9hcnQ, role: art, path: Roms/Game Boy Advance (GBA)/.media/Sky Garden Quest.png, sizeBytes: 50211, modifiedAt: '2026-10-02T09:12:00Z' }
                totalBytes: 17377096
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    delete:
      tags: [Library]
      operationId: deleteGame
      summary: Delete a game and its data (to the trash)
      description: |
        Moves to the ReminisLink trash (a rename on the same SD card, nothing
        is erased): the ROM (or the `.m3u` and its folder), the save and its
        clock file (`.rtc`), the states, the cheats and the art; the locks
        and the resume history of the game (ReminisLink copies) go into the
        same trash entry. With `keepSave=true`, the save and its clock file,
        the states, the locks and the resume history stay in place. Space is only freed when the trash is purged
        (automatically after 30 days, or with `DELETE /trash`). The discs of
        a multi-disc game that another playlist of the system still lists
        stay in place (M8), so that game stays playable.
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: keepSave
          in: query
          required: false
          description: Keep the save and its clock file (`.rtc`), the states, their locks and the resume history in place.
          schema: { type: boolean, default: false }
          example: false
      responses:
        '200':
          description: Moved to the trash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashMoveResult' }
              example:
                trashEntryId: tr_20261118T170000Z_a1b2
                moved:
                  - Roms/Game Boy Advance (GBA)/Sky Garden Quest.gba
                  - Saves/GBA/Sky Garden Quest.gba.sav
                  - Cheats/GBA/Sky Garden Quest.gba.cht
                movedBytes: 17377096
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/art:
    get:
      tags: [Library]
      operationId: getGameArt
      summary: Game art (PNG)
      description: |
        The art is found like the art of `GET /games/{gameId}` and opened
        confined to the system folder (no symbolic link); a refused art is
        answered `404`. An art that cannot be read (I/O error) is answered
        `500`, never `404`: the app keeps its copy.

        ETag, up to 8 MiB: SHA-256 of the content (`"sha256-..."`). The
        pak caches it per file version (path, size, date) in memory; any
        write of the pak (they all hold the write lock) empties that cache,
        and a request opened across a write does not use it, so a change
        made by the pak always gets a new `sha256-` ETag, even with the same
        size and date. A change made by something else while the pak runs,
        with the same size and date, is seen once the pak restarts.

        Beyond 8 MiB (the app never sends such an art): size and
        modification time (`"mt-..."`), not the content; a new file with the
        same size and date keeps the same ETag, whoever wrote it
        (docs/specs/04-api-v1.md).
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: If-None-Match
          in: header
          required: false
          description: ETag of the cached art.
          schema: { type: string }
          example: '"sha256-3f2a"'
      responses:
        '200':
          description: The art.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control:
              description: Always `private, max-age=86400`.
              schema: { type: string, const: 'private, max-age=86400' }
          content:
            image/png:
              schema: { type: string, contentMediaType: image/png }
              example: '<PNG image bytes>'
        '304':
          description: The cached art is still valid.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
    put:
      tags: [Library]
      operationId: setGameArt
      summary: Set the game art (PNG)
      description: |
        M8. Body: a PNG image (`Content-Type: image/png`), at most 4 MiB,
        at most 1024 x 1024 pixels; the app converts and scales the picture
        down before sending it. The pak checks the PNG signature, decodes
        the header for the dimensions (`422 unsupported_format` when the
        body is not a valid PNG or is larger than 1024 x 1024), then writes
        it atomically where NextUI reads it (`.media/<name>.png`, next to
        the game entry). An existing art first goes to the trash (reason
        `overwrite`). The body is signed like any other
        (`X-RL-Content-SHA256` is its hash).
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, contentMediaType: image/png }
            example: '<PNG image bytes>'
      responses:
        '200':
          description: Art set. The game as listed by `GET /systems/{systemId}/games` (`hasArt` is true).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
              example:
                id: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Ta3kgR2FyZGVuIFF1ZXN0LmdiYQ
                name: Sky Garden Quest
                fileName: Sky Garden Quest.gba
                kind: file
                sizeBytes: 16777216
                modifiedAt: '2026-10-02T09:12:00Z'
                hasSave: true
                stateCount: 3
                lockedStateCount: 1
                cheatCount: 12
                hasArt: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }
        '507': { $ref: '#/components/responses/InsufficientStorage' }
    delete:
      tags: [Library]
      operationId: deleteGameArt
      summary: Remove the game art (to the trash)
      description: |
        M8. Moves the art of the game to the trash (reason `overwrite`).
        `404 not_found` when the game does not exist or has no art.
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Art removed. The game as listed by `GET /systems/{systemId}/games` (`hasArt` is false).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Game' }
              example:
                id: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Ta3kgR2FyZGVuIFF1ZXN0LmdiYQ
                name: Sky Garden Quest
                fileName: Sky Garden Quest.gba
                kind: file
                sizeBytes: 16777216
                modifiedAt: '2026-10-02T09:12:00Z'
                hasSave: true
                stateCount: 3
                lockedStateCount: 1
                cheatCount: 12
                hasArt: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /games/{gameId}/deletion:
    get:
      tags: [Library]
      operationId: previewGameDeletion
      summary: Preview what deleting a game moves and keeps
      description: |
        M8. Read only. The exact selection `DELETE /games/{gameId}` would
        make now with the same `keepSave` (computed by the same code on the
        pak), so the app can show it before asking for confirmation.
        Folders are expanded to their files, recursively. `moved` lists the
        files that would go to the trash, the ReminisLink copies of the
        game included (locks and resume history, role `other`, names
        starting with `ReminisLink/`); `kept` lists the files deliberately
        left in place: the discs (and the tracks of their `.cue`) that
        another playlist of the system still lists, and, with
        `keepSave=true`, the save, its clock file, the states and their
        side files, the locks and the resume history. `movedBytes` is the
        size of every file of `moved`. `name` is informative, never an
        absolute path: relative to the system folder for the files under
        `Roms/`, relative to the SD card for the other files of the game
        (`Saves/GBA/Game.gba.sav`), and `ReminisLink/...` for the copies of
        the pak.
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: keepSave
          in: query
          required: false
          description: Same meaning as for `DELETE /games/{gameId}`.
          schema: { type: boolean, default: false }
          example: false
      responses:
        '200':
          description: The selection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionPreview' }
              example:
                moved:
                  - { name: Sky Garden Quest.gba, role: rom, size: 16777216 }
                  - { name: Saves/GBA/Sky Garden Quest.gba.sav, role: save, size: 131072 }
                kept: []
                movedBytes: 16908288
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /trash:
    get:
      tags: [Trash]
      operationId: listTrash
      summary: Trash content and size
      description: |
        One entry groups everything a single operation moved to the trash.
        Entries are purged when the pak starts once their credited age
        reaches 30 days: the age grows with the running time of the pak and,
        at each launch, with the time since the last close (at most 7 days
        per launch), so a wrong console clock can only delay the purge.
        Restoring from the trash is not part of v1.
      responses:
        '200':
          description: Trash entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashList' }
              example:
