        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/ShuttingDown' }

  /saves:
    get:
      tags: [Saves]
      operationId: listSaves
      summary: List every save of every game (sync)
      description: |
        M9. Read only. Every game of every system that has a save, in one
        request, with the size, the date and the SHA-256 of the save, so the
        app downloads (`GET /games/{gameId}/save`, `GET /games/{gameId}/save/rtc`)
        only the saves whose `sha256` changed since its last sync.

        Same games and same save resolution as `GET /systems/{systemId}/games`
        and `GET /games/{gameId}` (`file`, `m3u`, `folder-m3u` and
        `folder-cue` games, subfolders included; the save is named after the
        ROM, the `.m3u` or the `.cue`, matched ignoring case). A game is
        listed only when it has a save file (`.sav`); a clock file (`.rtc`)
        belongs to its save (M5) and is given in `rtc`, never listed alone (a
        game with only a `.rtc` is not listed, and has no save to download).
        Two games of a system with the same ROM file name in different
        folders share one save file on NextUI: both are listed, with the
        same `path` and `sha256`.

        Saves of at most 1 MiB (nearly all of them) are hashed at every
        request: a save rewritten in place can keep its size and its date,
        and exFAT has no other change indicator. Larger ones (and their
        clock files) reuse a cached hash while the file (device and inode),
        its size, its modification time and, where the platform has one,
        its status change time are unchanged, and only when it was modified
        at least 3 s before the hash was computed. Files that
        are symbolic links, reached through one (even one that stays in
        the saves folder), or outside the saves folder are skipped. One listing runs at a time
        (a second request waits). Order: stable, not meaningful. At most
        10000 saves: beyond, `truncated` is true and the app must not infer
        anything from a save missing from the list. `path` is informative
        and never sent back; `modifiedAt` comes from the device clock
        (informative): compare `sha256`.
      responses:
        '200':
          description: The saves.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaveList' }
              example:
                saves:
                  - gameId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKS9Ta3kgR2FyZGVuIFF1ZXN0LmdiYQ
                    systemId: R2FtZSBCb3kgQWR2YW5jZSAoR0JBKQ
                    gameName: Sky Garden Quest
                    fileName: Sky Garden Quest.gba
                    path: Saves/GBA/Sky Garden Quest.gba.sav
                    sizeBytes: 131072
                    modifiedAt: '2026-11-18T16:55:00Z'
                    sha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
                    rtc:
                      path: Saves/GBA/Sky Garden Quest.gba.rtc
                      sizeBytes: 16
                      modifiedAt: '2026-11-18T16:55:00Z'
