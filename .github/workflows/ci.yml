# Lint, test and build the pak, check the contract and test the iOS app on
# every push and pull request. On a vX.Y.Z tag, also publish the GitHub
# release read by the NextUI Pak Store (ReminisLink.pak.zip, with
# ReminisLink.knulli.zip beside it); on a vX.Y.Z-beta.N or vX.Y.Z-rc.N tag,
# a GitHub pre-release (never "Latest") with the same two zips.
# The app's tags (ios-vX.Y.Z, ios-beta-vX.Y.Z-beta.N) never start this
# workflow: Xcode Cloud builds them (ios/README.md, "Release"); the Android
# app's tags (android-vX.Y.Z...) start .github/workflows/android-release.yml
# only. Keep the tag
# filter "v*": a glob anchored at the start, so ios-* cannot match (checked by
# scripts/test-release-scripts.sh, run in the go job).
# Adapted from .github/workflows/ci.yml of github.com/tfournier/nextui-cheat-manager.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint and unit tests
        run: make lint test
      - name: Tests with the race detector
        run: CGO_ENABLED=1 go test -race ./...
      - name: Short fuzzing of the patch parsers
        run: make fuzz FUZZTIME=10s
      - name: Release scripts (pak tags, Xcode Cloud scripts, app release notes)
        run: make release-checks

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Redocly runs in Docker; the test vectors are checked on both sides.
      - run: make contract

  build:
    needs: [go, contract]
    runs-on: ubuntu-latest
    # Debian 11: old glibc / SDL2, compatible with the TrimUI firmware.
    container: debian:bullseye@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - name: Install the ARM64 toolchain
        run: |
          sh scripts/setup-toolchain.sh > /tmp/setup.log 2>&1 || { tail -n 50 /tmp/setup.log; exit 1; }
          echo "GOPATH=$GITHUB_WORKSPACE/.go" >> "$GITHUB_ENV"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/cache@v6
        with:
          path: |
            .go/pkg/mod
            ~/.cache/go-build
          key: go-arm64-${{ hashFiles('go.sum') }}
          restore-keys: go-arm64-

      - name: Build the release zip
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            make release VERSION="$GITHUB_REF_NAME" TAG="$GITHUB_REF_NAME"
          else
            make release VERSION="$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: reminislink-pak
          path: dist/ReminisLink.pak.zip
          if-no-files-found: error

      # Knulli (experimental, M20): attached to every pak release and
      # pre-release by the release job, from v1.1.0-beta.1 on (decision of
      # 2026-11-23).
      - name: Build the Knulli zip
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            make knulli-release VERSION="$GITHUB_REF_NAME"
          else
            make knulli-release VERSION="$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: reminislink-knulli
          path: dist/ReminisLink.knulli.zip
          if-no-files-found: error

  emulation:
    # M20 (scripts/emulation/run.sh): the content of both zips, the unit
    # tests on a case-sensitive file system, the pak headless on the card of
    # each platform and of Knulli in a userland with the glibc of each
    # firmware (linux/arm64 containers, native on this runner), what the
    # shipped binary and its bundled libraries need, and the shipped binary
    # started through each launcher. The stock rootfs of the Brick is not
    # available here: tg5040 is skipped.
    needs: [build]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Both zips as built: their content is checked, and the shipped
      # binary is started through each launcher (scripts/emulation/run.sh
      # reads the binary from the NextUI zip).
      - uses: actions/download-artifact@v8
        with:
          name: reminislink-pak
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: reminislink-knulli
          path: dist
      - name: Zips, case-sensitive unit tests and smoke tests in each userland
        run: make emulation REQUIRE_ZIPS=1

  # The app's tests run in three jobs side by side, each on its own Mac and
  # building the app itself (a build shared through an artifact would only
  # add an upload, a download and a job start before the tests): ios, then
  # the UI tests split in two halves, ios-ui-1 and ios-ui-2. The release
  # gate of the app needs all three (CI_JOBS_IOS in the Makefile,
  # RL_CI_JOBS_IOS for Xcode Cloud).
  ios:
    # ReminisLinkKit, the release scripts and the app's unit tests.
    # Swift tools 6.2 and the iOS 18+ simulator: Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: ReminisLinkKit tests
        working-directory: ios/ReminisLinkKit
        run: swift test
      # On a Mac the release checks also run the App Store Connect client
      # (Swift, CryptoKit) against a local mock of the API.
      - name: Release scripts with the App Store Connect client
        run: make release-checks
      - name: App unit tests
        working-directory: ios
        run: |
          # The runner image changes its simulators over time: take the
          # first available iPhone instead of a fixed model name.
          udid=$(xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $udid"
          xcodebuild test -scheme ReminisLink \
            -destination "id=$udid" \
            -only-testing:ReminisLinkTests \
            -retry-tests-on-failure -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO

  ios-ui-1:
    # Half 1 of the app's UI test classes (scripts/ios-ui-shard.sh 1 2:
    # a fixed split balanced on their CI durations; no class left out nor
    # run twice, checked by scripts/test-release-scripts.sh), on one
    # simulator. Never 2 simulators on one runner (3 cores, 7 GB): tried on
    # 2026-11-22, each UI test took 80 to 100 s instead of about 30, the app
    # failed to launch now and then and the job ran 67 to 83 min, red.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: App UI tests, half 1 of 2
        working-directory: ios
        run: |
          # The runner image changes its simulators over time: take the
          # first available iPhone instead of a fixed model name.
          udid=$(xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $udid"
          # Fails (and stops the job) rather than give no -only-testing,
          # which would run every test.
          only=$(../scripts/ios-ui-shard.sh 1 2)
          echo "$only"
          # UI tests time out now and then on the shared macOS runners (a
          # different test each run, all green locally): a failed test is
          # run again, up to 3 times in all, before the job fails. $only
          # splits on purpose: one -only-testing argument per line.
          xcodebuild test -scheme ReminisLink \
            -destination "id=$udid" \
            $only \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO

  ios-ui-2:
    # Half 2 of the app's UI test classes (scripts/ios-ui-shard.sh 2 2:
    # a fixed split balanced on their CI durations; no class left out nor
    # run twice, checked by scripts/test-release-scripts.sh), on one
    # simulator. Never 2 simulators on one runner (3 cores, 7 GB): tried on
    # 2026-11-22, each UI test took 80 to 100 s instead of about 30, the app
    # failed to launch now and then and the job ran 67 to 83 min, red.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: App UI tests, half 2 of 2
        working-directory: ios
        run: |
          # The runner image changes its simulators over time: take the
          # first available iPhone instead of a fixed model name.
          udid=$(xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $udid"
          # Fails (and stops the job) rather than give no -only-testing,
          # which would run every test.
          only=$(../scripts/ios-ui-shard.sh 2 2)
          echo "$only"
          # UI tests time out now and then on the shared macOS runners (a
          # different test each run, all green locally): a failed test is
          # run again, up to 3 times in all, before the job fails. $only
          # splits on purpose: one -only-testing argument per line.
          xcodebuild test -scheme ReminisLink \
            -destination "id=$udid" \
            $only \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO

  android:
    # Android app (M21): :core unit tests (shared test vectors, pinning and
    # signing against MockWebServer) and the debug APK. No emulator here:
    # the instrumented and end-to-end tests run on a Mac (android/scripts/pak-e2e.sh).
    # Pinned image, JDK patch and SDK packages (as android-release.yml): two
    # builds of a commit give the same unsigned APK, checked below.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21.0.13"
      - uses: gradle/actions/setup-gradle@v6
      - name: Android SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null
      - name: Unit tests
        run: make android-test
      - name: Android lint
        run: make android-lint
      - name: Debug APK
        run: make android-build
      - uses: actions/upload-artifact@v7
        with:
          name: reminislink-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Compile the instrumented tests
        working-directory: android
        run: ./gradlew --console=plain :app:assembleDebugAndroidTest
      # R8 and the release configuration (unsigned: no secret here; the
      # signed APK is built by android-release.yml on android-v* tags).
      - name: Release APK (unsigned), built twice and compared
        run: |
          make android-release-apk
          first=$(sha256sum android/app/build/outputs/apk/release/app-release-unsigned.apk | cut -d' ' -f1)
          (cd android && ./gradlew --console=plain :app:clean :app:assembleRelease --no-build-cache)
          second=$(sha256sum android/app/build/outputs/apk/release/app-release-unsigned.apk | cut -d' ' -f1)
          echo "release APK: $first / $second"
          [ "$first" = "$second" ] || { echo "The release APK is not reproducible"; exit 1; }
      - name: Compile the smoke test of the minified build
        working-directory: android
        run: ./gradlew --console=plain :app:assembleMinifiedAndroidTest -Preminislink.testBuildType=minified

  release:
    # refs/tags/v...: an app tag (refs/tags/ios-v...) can never match.
    if: startsWith(github.ref, 'refs/tags/v')
    # The pak release depends on the pak jobs only (emulation included,
    # M20): the iOS app has its own release path (M17).
    needs: [go, contract, build, emulation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: reminislink-pak
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: reminislink-knulli
          path: dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # latest (vX.Y.Z) or prerelease (vX.Y.Z-beta.N, -rc.N); any other
        # tag (an app tag above all) stops there: only a pak release can be
        # "Latest", the release the Pak Store reads. A re-run sets the flags
        # of the existing release again, then never deletes nor replaces a
        # published zip: identical (SHA-256) kept, missing uploaded,
        # different: the job fails and asks for a manual check. The
        # NextUI zip keeps its name: the Pak Store downloads the asset named
        # by release_filename in pak.json.
        run: scripts/publish-pak-release.sh "$TAG" dist/ReminisLink.pak.zip dist/ReminisLink.knulli.zip
