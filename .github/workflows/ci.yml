# Lint, test and build the pak, check the contract and test the iOS app on
# every push and pull request. On a vX.Y.Z tag, also publish the GitHub
# release read by the NextUI Pak Store (ReminisLink.pak.zip); on a
# vX.Y.Z-beta.N or vX.Y.Z-rc.N tag, a GitHub pre-release (never "Latest").
# The app's tags (ios-vX.Y.Z[-beta.N]) never start this workflow: Xcode
# Cloud builds them (ios/README.md, "Release"). Keep the tag filter "v*":
# a glob anchored at the start, so ios-v* cannot match (checked by
# scripts/test-release-scripts.sh, run in the go job).
# Adapted from .github/workflows/ci.yml of github.com/tfournier/nextui-cheat-manager.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Lint and unit tests
        run: make lint test
      - name: Tests with the race detector
        run: CGO_ENABLED=1 go test -race ./...
      - name: Short fuzzing of the patch parsers
        run: make fuzz FUZZTIME=10s
      - name: Release scripts (pak tags, Xcode Cloud scripts, app release notes)
        run: make release-checks

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Redocly runs in Docker; the test vectors are checked on both sides.
      - run: make contract

  build:
    needs: [go, contract]
    runs-on: ubuntu-latest
    # Debian 11: old glibc / SDL2, compatible with the TrimUI firmware.
    container: debian:bullseye@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - name: Install the ARM64 toolchain
        run: |
          sh scripts/setup-toolchain.sh > /tmp/setup.log 2>&1 || { tail -n 50 /tmp/setup.log; exit 1; }
          echo "GOPATH=$GITHUB_WORKSPACE/.go" >> "$GITHUB_ENV"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/cache@v6
        with:
          path: |
            .go/pkg/mod
            ~/.cache/go-build
          key: go-arm64-${{ hashFiles('go.sum') }}
          restore-keys: go-arm64-

      - name: Build the release zip
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            make release VERSION="$GITHUB_REF_NAME" TAG="$GITHUB_REF_NAME"
          else
            make release VERSION="$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: reminislink-pak
          path: dist/ReminisLink.pak.zip
          if-no-files-found: error

  ios:
    # Swift tools 6.2 and the iOS 18+ simulator: Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: ReminisLinkKit tests
        working-directory: ios/ReminisLinkKit
        run: swift test
      - name: App tests
        working-directory: ios
        run: |
          # The runner image changes its simulators over time: take the
          # first available iPhone instead of a fixed model name.
          udid=$(xcrun simctl list devices available -j |
            jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "Simulator: $udid"
          xcodebuild test -scheme ReminisLink \
            -destination "id=$udid" \
            CODE_SIGNING_ALLOWED=NO

  release:
    # refs/tags/v...: an app tag (refs/tags/ios-v...) can never match.
    if: startsWith(github.ref, 'refs/tags/v')
    # The pak release depends on the pak jobs only: the iOS app has its own
    # release path (M17).
    needs: [go, contract, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: reminislink-pak
          path: dist

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # latest (vX.Y.Z) or prerelease (vX.Y.Z-beta.N, -rc.N); any other
          # tag (an app tag above all) stops here: only a pak release can
          # be "Latest", the release the Pak Store reads.
          kind=$(scripts/pak-release-kind.sh "$TAG")
          if [ "$kind" = latest ]; then
            # Release notes: the pak.json changelog entry of this version
            jq -r --arg v "$TAG" '.changelog[$v] // empty' pak.json > release-notes.md
            flags="--latest"
          else
            # A pre-release leaves pak.json unchanged: its notes are the
            # "Unreleased" entry.
            { echo "Pre-release for testers, not offered by the Pak Store."; echo
              jq -r '.changelog.Unreleased // empty' pak.json; } > release-notes.md
            flags="--prerelease --latest=false"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run: replace the assets of the existing release.
            gh release upload "$TAG" dist/ReminisLink.pak.zip --clobber
          else
            # shellcheck disable=SC2086 # $flags holds several options
            gh release create "$TAG" dist/ReminisLink.pak.zip --verify-tag --title "$TAG" --notes-file release-notes.md $flags
          fi
