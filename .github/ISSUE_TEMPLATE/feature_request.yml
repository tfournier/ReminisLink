name: Feature request
description: Suggest an idea for the pak or the app.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to do, and why?
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      multiple: true
      options:
        - Pak (on the handheld)
        - iPhone app
        - iPad app
        - Mac app
        - Android app
        - Website
    validations:
      required: true
  - type: input
    id: handheld
    attributes:
      label: Handheld and firmware (optional)
      description: If the idea is about one handheld or firmware.
      placeholder: "TrimUI Brick, NextUI"
  - type: textarea
    id: screenshots
    attributes:
      label: Mockups or screenshots (optional)
