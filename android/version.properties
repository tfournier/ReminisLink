# Version of the Android app (SemVer, CLAUDE.md rule 6), numbered on its own:
# the release tag is android-v<versionName>. Written by "make android-vX.Y.Z"
# (never by hand): versionCode is derived from versionName by
# scripts/android-version-code.sh, and the build refuses a mismatch.
# F-Droid reads both values here (UpdateCheckData).
versionName=1.0.0
versionCode=1000099
